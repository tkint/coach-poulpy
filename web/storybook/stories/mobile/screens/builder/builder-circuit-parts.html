<main class="phone" style="--frame-height: 1560px">
<header class="top-bar" style="padding: var(--cp-space-xxxl) var(--cp-space-md) var(--cp-space-sm); justify-content: flex-start; gap: var(--cp-space-xs);">
    <button type="button" class="icon-button" aria-label="Close"><MobileIcon name="x" :size="22" /></button>
    <h1 class="headline" style="flex: 1;">New workout</h1>
    <MobileButton size="sm">Save</MobileButton>
  </header>

  <div class="page-body builder-body">
    <label class="field">
      <span class="label">Name</span>
      <input class="text-field" type="text" value="Full body burner">
    </label>
    <div class="format-line" id="format" data-component="format-line">
      <span class="label">Format</span>
      <button type="button" class="format-control" data-component="format-control" aria-haspopup="dialog" aria-label="Format: Circuit. Change it"><span class="format-pill"><MobileIcon name="repeat" :size="18" /><strong>Circuit</strong><MobileIcon name="chevron-down" :size="16" /></span></button>
    </div>
    <fieldset class="recap-part builder-block" id="warm-up" data-component="recap-part" aria-label="Warm-up">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon" aria-hidden="true"><MobileIcon name="sun" :size="20" /></span><div><h2>Warm-up</h2><p>2 exercises · about 2 min</p></div></div></legend>
          <ol class="steps" data-reorder><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="person-standing" :size="18" /></span><span class="row-text"><strong>Jumping jack</strong><span>30 s</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Jumping jack"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="person-standing" :size="18" /></span><span class="row-text"><strong>Air squat</strong><span>10 reps</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Air squat"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li></ol>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to warm-up"><MobileIcon name="plus" :size="16" /></button>
        </fieldset>
    <fieldset class="recap-part builder-block" id="work" data-component="recap-part" aria-label="Work">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon part-icon--work" aria-hidden="true"><MobileIcon name="zap" :size="20" /></span><div><h2>Work</h2><p>5 exercises · about 19 min</p></div></div></legend>
          <ol class="steps" data-reorder><li><section class="repeat" data-component="repeat" aria-label="Repeat 4 times">
              <div class="repeat-header"><MobileIcon name="repeat" :size="20" /><strong>Repeat</strong>
                <span class="repeat-count" role="group" aria-label="Number of times"><button type="button" aria-label="Fewer times">−</button><span>4 times</span><button type="button" aria-label="More times">+</button></span>
                <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for this repeat"><MobileIcon name="ellipsis-vertical" :size="20" /></button></div>
              <ol class="steps"><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="dumbbell" :size="18" /></span><span class="row-text"><strong>Goblet squat</strong><span>15 reps · 16 kg</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Goblet squat"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="person-standing" :size="18" /></span><span class="row-text"><strong>Push-up</strong><span>10 reps</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Push-up"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="footprints" :size="18" /></span><span class="row-text"><strong>Run</strong><span>200 m · 5:00 /km</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Run"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="timer" :size="18" /></span><span class="row-text"><MobileRoleTag>Recover</MobileRoleTag><strong>Rest</strong><span>1 min</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Rest"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li></ol>
            </section></li><li><section class="repeat" data-component="repeat" aria-label="Repeat 3 times">
              <div class="repeat-header"><MobileIcon name="repeat" :size="20" /><strong>Repeat</strong>
                <span class="repeat-count" role="group" aria-label="Number of times"><button type="button" aria-label="Fewer times">−</button><span>3 times</span><button type="button" aria-label="More times">+</button></span>
                <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for this repeat"><MobileIcon name="ellipsis-vertical" :size="20" /></button></div>
              <ol class="steps"><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="person-standing" :size="18" /></span><span class="row-text"><strong>Plank</strong><span>40 s hold</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Plank"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="footprints" :size="18" /></span><span class="row-text"><strong>Crunch</strong><span>15 reps</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Crunch"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li></ol>
            </section></li></ol>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to Work"><MobileIcon name="plus" :size="16" /></button>
        </fieldset>
    <fieldset class="recap-part builder-block" id="cool-down" data-component="recap-part" aria-label="Cool down">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon" aria-hidden="true"><MobileIcon name="moon" :size="20" /></span><div><h2>Cool down</h2><p>1 exercise · 1 min</p></div></div></legend>
          <ol class="steps" data-reorder><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="person-standing" :size="18" /></span><span class="row-text"><strong>Hamstring stretch</strong><span>30 s hold · each side</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Hamstring stretch"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li></ol>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to cool down"><MobileIcon name="plus" :size="16" /></button>
        </fieldset>
  </div>
</main>
