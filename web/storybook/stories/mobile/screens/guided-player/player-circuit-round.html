<main class="phone player">
  <div class="session-progress" id="session-progress">
    <button class="icon-button icon-button--filled" type="button" aria-label="Pause"><MobileIcon name="pause" :size="20" /></button>
    <div>
      <span class="label numbers">Step 7 of 25 · 05:48</span>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="25" aria-valuenow="7" aria-label="Session progress"><div style="width: 28%;"></div></div>
    </div>
    <button type="button" class="icon-button icon-button--filled" aria-label="End session"><MobileIcon name="x" :size="22" /></button>
  </div>

  <div class="player-step" id="current-step">
    <img src="../../../poulpy/pose_straining.svg" alt="Poulpy straining">
    <span class="part-line" id="part-line" data-component="part-line"><MobileIcon name="zap" :size="16" />Work 1 · round 2 of 4</span>
    <h1 class="title">Goblet squat</h1>
    <span class="no-dots" aria-hidden="true"></span>
    <span class="target-value">15</span>
    <span class="target-unit">reps at 16 kg</span>
  </div>

  <div class="next-card" id="next-step" data-component="next-card"><span class="label">Next</span><span>Push-up · 10 reps</span></div>

  <div class="player-actions">
    <MobileButton kind="secondary" large>Skip</MobileButton>
    <MobileButton large icon="check" :icon-size="24">Done</MobileButton>
  </div>
</main>
