<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · sign up, offline</title>
<meta name="mockup:screen" content="account-sign-up-offline">
<meta name="mockup:section" content="Accounts">
<meta name="mockup:issue" content="272">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">
  <header class="top-bar" style="justify-content: flex-start;"><a class="icon-button" href="account-settings-guest.html" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a></header>
  <div class="form-body" style="padding-top: var(--cp-space-sm);">
    <div class="intro"><h1 class="title" style="font-size: 30px; line-height: 34px;">Your account</h1><p class="muted">Back up your training and pick it up on any phone. The app keeps working without a connection.</p></div>
    <div class="segmented" role="tablist" aria-label="Your account" id="entry-tabs" data-component="segmented"><a role="tab" href="account-sign-up.html" aria-checked="true">Create account</a><a role="tab" href="account-sign-in.html" aria-checked="false">Sign in</a></div>
    <section class="error-card" id="offline-error" data-component="error-card" role="alert"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><p>No connection. Try again when you’re online; the app keeps working as a guest.</p></section>
    <div class="field" id="email-field"><label class="label" for="email">Email</label><input class="text-field" id="email" type="email" value="alex@example.com" autocomplete="email"></div>
    <div class="field" id="password-field"><label class="label" for="password">Password</label><span class="password-field"><input class="text-field" id="password" type="password" value="correct horse battery" autocomplete="new-password" aria-describedby="password-hint"><button type="button" class="icon-button" aria-label="Show password" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span><span class="field-note" id="password-hint">8 characters or more.</span></div>
    <div class="field" id="consent-field"><label class="check-row" data-component="check-row"><input type="checkbox" id="consent" checked><span>I agree that Coach Poulpy keeps my health data (sessions, measurements, pain) to sync it between my phones. <a class="link" href="account-sign-up-consent-sheet.html">What is stored and why</a></span></label></div>
  </div>
  <div class="action-bar">
    <a class="primary-button" data-component="primary-button" href="account-check-email.html" style="flex: 1;">Create account</a>
  </div>
</main>
</body>
</html>
