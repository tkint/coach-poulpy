<main class="phone">
  <div class="screen-header">
    <span class="label">Saturday 24 October</span>
    <h1>Home</h1>
  </div>
  <div class="page-body" style="padding-top: var(--cp-space-sm); gap: var(--cp-space-sm);">
    <MobilePoulpyCard id="poulpy" aria-label="Poulpy" title="Nice one" meta="6 of 8 lit · 1 full octopus">
      <template #art><MobileTentacleRing :lit="6" label="6 of 8 lit · 1 full octopus" picture="../../../poulpy/mood_happy.svg" picture-alt="Poulpy, happy" /></template>
      Another tentacle lit. 2 to go.
    </MobilePoulpyCard>
    <span class="label label-row">Today</span>
    <button type="button" class="card" id="today-session" data-component="session-card" style="display: flex; align-items: center; gap: var(--cp-space-sm); padding: var(--cp-space-sm); min-height: 60px;">
      <span class="row-icon row-icon--done" aria-hidden="true"><MobileIcon name="check" :size="22" /></span>
      <span class="row-text"><strong>Lower body strength</strong><span>18:05 · 38:24 · 17 of 18 sets</span></span>
      <span class="chevron"><MobileIcon name="chevron-right" :size="20" /></span>
    </button>
    <button type="button" class="text-link" style="align-self: flex-start; margin: -4px var(--cp-space-xs) 0;">Something else? Pick from your library<MobileIcon name="chevron-right" :size="18" /></button>
    <span class="label label-row" style="margin-top: var(--cp-space-xs);">Next session</span>
    <button type="button" class="list-row" id="next-session" data-component="list-row" style="border-radius: var(--cp-radius-lg); padding: var(--cp-space-sm);">
      <span aria-hidden="true" style="width: 44px; height: 48px; border-radius: var(--cp-radius-md); background: var(--cp-background); border: 1px solid var(--cp-outline); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none;">
        <span class="label label--primary" style="font-size: 11.5px; line-height: 14px;">Tue</span>
        <span style="font-family: var(--cp-font-display); font-size: 20px; line-height: 22px; font-weight: 700; color: var(--cp-on-primary-container);">27</span>
      </span>
      <span class="row-text"><strong>Upper body</strong><span>In 3 days · Sets · about 32 min</span></span>
      <span class="chevron"><MobileIcon name="chevron-right" :size="20" /></span>
    </button>
  </div>
  <MobileNavBar active="home" />
</main>
