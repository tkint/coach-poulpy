<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · recover in a round</title>
<meta name="mockup:screen" content="player-recover">
<meta name="mockup:section" content="Guided player">
<meta name="mockup:issue" content="92">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone player">
  <div class="session-progress" id="session-progress">
    <button class="icon-button icon-button--filled" type="button" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    <div>
      <span class="label numbers">Step 10 of 25 · 07:05</span>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="25" aria-valuenow="10" aria-label="Session progress"><div style="width: 40%;"></div></div>
    </div>
    <a class="icon-button icon-button--filled" href="#" aria-label="End session"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>

  <div class="player-step" id="current-step" style="gap: 14px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <span class="part-line" id="part-line" data-component="part-line"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>Work 1 · round 2 of 4</span>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="role-tag" data-component="role-tag" style="align-self: center;">Recover</span>
        <h1 class="title" style="color: var(--cp-primary);">Rest</h1>
      </div>
    </div>
    <div class="rest-timer" id="rest-timer" data-component="rest-timer">
      <svg viewBox="0 0 200 200" width="260" height="260" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="12"/>
        <circle class="left" cx="100" cy="100" r="88" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="166"/>
      </svg>
      <div>
        <img src="../../../poulpy/pose_side_glance.svg" alt="Poulpy glancing to the side, catching his breath">
        <span role="timer" aria-label="42 seconds left">00:42</span>
      </div>
    </div>
    <div class="adjust-buttons">
      <button type="button">−15 s</button>
      <button type="button">+15 s</button>
    </div>
  </div>

  <div class="next-card next-card--stacked" id="next-step" data-component="next-card">
    <span class="label">Next up · round 3 of 4</span>
    <span class="headline">Goblet squat</span>
    <span class="muted numbers" style="font-weight: 500;">15 reps at 16 kg</span>
  </div>

  <a class="tonal-button tonal-button--large" data-component="tonal-button" href="player-circuit-round.html"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M5 5l10 7-10 7z"/><rect x="16" y="5" width="3" height="14" rx="1"/></svg>Skip rest</a>
</main>
</body>
</html>
