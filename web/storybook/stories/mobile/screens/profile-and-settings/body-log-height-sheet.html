<main class="phone">

  <header class="page-bar"><button type="button" class="icon-button" aria-label="Back to height"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-left"><path d="m15 18-6-6 6-6"/></svg></button><div><h1>Height</h1></div></header>
  <div class="scrim"></div>
  <MobileSheet id="log-sheet" aria-label="Log your height">
    <span class="sheet-handle"></span>
    <div class="sheet-title"><h2>Log your height</h2><p>Type it, or nudge it with − and +. Stored in centimetres, shown in your units.</p></div>
    <div class="number-entry" data-component="number-entry"><button type="button" aria-label="Less">−</button><span class="number-field number-field--large"><input inputmode="numeric" value="5" aria-label="Feet" autofocus><span class="unit">ft</span></span><span class="number-field number-field--large"><input inputmode="decimal" value="9" aria-label="Inches"><span class="unit">in</span></span><button type="button" aria-label="More">+</button></div>
    <button class="select-field" type="button" data-component="select-field"><span><span class="label">Date</span><strong>Today, 1 November</strong></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-right"><path d="m9 18 6-6-6-6"/></svg></button>
    <div class="sheet-actions"><button class="secondary-button" type="button">Cancel</button><button class="primary-button" type="button" style="flex: 1;">Save</button></div>
  </MobileSheet>
</main>
