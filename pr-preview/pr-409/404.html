afts\",\"collapsed\":true,\"items\":[]}]}]},{\"text\":\"Profile and settings\",\"link\":\"/docs/profile-and-settings\"},{\"text\":\"Generating tokens and fonts\",\"link\":\"/design/README\"},{\"text\":\"Body map shapes: credits\",\"link\":\"/design/body-map-source/NOTICE\"}]}],\"/docs/architecture\":[{\"text\":\"Architecture\",\"items\":[{\"text\":\"Overview\",\"link\":\"/docs/architecture\"},{\"text\":\"Roadmap\",\"link\":\"/docs/roadmap\"},{\"text\":\"Glossary\",\"link\":\"/CONTEXT\"},{\"text\":\"The workout file\",\"link\":\"/docs/workout-file\"},{\"text\":\"The API\",\"link\":\"/docs/the-api\"},{\"text\":\"Accounts\",\"link\":\"/docs/accounts\"},{\"text\":\"The admin area\",\"link\":\"/docs/admin\"},{\"text\":\"The web app\",\"link\":\"/docs/web-app\"},{\"text\":\"Decisions\",\"link\":\"/decisions/\",\"collapsed\":true,\"items\":[{\"text\":\"0001 · Local-first: the phone is the source of truth\",\"link\":\"/docs/adr/0001-local-first-phone-is-the-source-of-truth\"},{\"text\":\"0002 · One Kotlin Multiplatform core for every platform\",\"link\":\"/docs/adr/0002-one-kotlin-multiplatform-core\"},{\"text\":\"0003 · Sessions are stored as append-only event logs\",\"link\":\"/docs/adr/0003-sessions-are-append-only-event-logs\"},{\"text\":\"0004 · Workout types are modules over one engine\",\"link\":\"/docs/adr/0004-workout-types-are-modules-over-one-engine\"},{\"text\":\"0005 · Ids are UUIDv7 made on the device\",\"link\":\"/docs/adr/0005-ids-are-uuidv7-made-on-the-device\"},{\"text\":\"0006 · Sync keeps both conflicting edits\",\"link\":\"/docs/adr/0006-sync-keeps-both-edits\"},{\"text\":\"0007 · Postgres: columns for structure, JSONB for content\",\"link\":\"/docs/adr/0007-postgres-columns-for-structure-jsonb-for-content\"},{\"text\":\"0008 · A curated catalog with stable slugs, updated without an account\",\"link\":\"/docs/adr/0008-curated-catalog-with-stable-slugs\"},{\"text\":\"0009 · Shared plans are saved synced or as a copy; enrollments pin a version\",\"link\":
