# The local Postgres that ./gradlew :server:run connects to by default (DATABASE_URL and the rest
# are only needed elsewhere). Start it with: docker compose -f tools/compose.yaml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: coachpoulpy
      POSTGRES_USER: coachpoulpy
      POSTGRES_PASSWORD: coachpoulpy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
