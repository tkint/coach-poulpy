# Labels and milestones for this repo. The "Labels" workflow applies this file to GitHub when it
# changes on main: it creates and updates what is listed here and deletes the labels under
# `remove`. Labels not listed are left alone.

labels:
  # Type
  - name: bug
    color: "d73a4a"
    description: Something is broken
  - name: enhancement
    color: "a2eeef"
    description: New feature or improvement
  - name: documentation
    color: "0075ca"
    description: Docs, ADRs or the glossary

  # State (the triage skill's five roles)
  - name: needs-triage
    color: "fbca04"
    description: Waiting for a first look
  - name: needs-info
    color: "f9d0c4"
    description: Waiting on more detail from whoever opened it
  - name: ready-for-agent
    color: "0e8a16"
    description: Fully specified; a Claude thread can take it
  - name: ready-for-human
    color: "5319e7"
    description: "Needs a person: a decision, a purchase or a test by hand"
  - name: wontfix
    color: "ffffff"
    description: Will not be done

  # Area
  - name: area:shared
    color: "c5def5"
    description: Shared Kotlin (model, engine, types, stats, shared view models)
  - name: area:android
    color: "c5def5"
    description: The Android app
  - name: area:ios
    color: "c5def5"
    description: The iOS app
  - name: area:devices
    color: "c5def5"
    description: Bluetooth devices and metric sources
  - name: area:catalog
    color: "c5def5"
    description: The exercise catalog
  - name: area:server
    color: "c5def5"
    description: The http4k server and Postgres
  - name: area:web
    color: "c5def5"
    description: The Vue website
  - name: area:design
    color: "c5def5"
    description: Tokens, Poulpy drawings, brand and the docs site

  # Check
  - name: device-test
    color: "d93f0b"
    description: Has to be checked on a real phone or treadmill, not only in CI

  # Wayfinder maps and tickets
  - name: wayfinder:map
    color: "1d76db"
    description: A wayfinder map of decision tickets
  - name: wayfinder:research
    color: "bfdadc"
    description: Wayfinder ticket answered by research
  - name: wayfinder:prototype
    color: "bfdadc"
    description: Wayfinder ticket answered by a prototype
  - name: wayfinder:grilling
    color: "bfdadc"
    description: Wayfinder ticket answered by grilling
  - name: wayfinder:task
    color: "bfdadc"
    description: Wayfinder ticket answered by doing a small task

remove:
  - duplicate
  - good first issue
  - help wanted
  - invalid
  - question

# One milestone per release, named "<version> · <theme>"; a release belongs to a phase, named in its
# description. The plan is docs/roadmap.md. Every issue has exactly one milestone.
milestones:
  - title: 0.11 · Home, Library, You
    description: "Phase 1, Version 1. The three-tab bar, the diary Home with Record, You, Achievements"
  - title: 0.12 · Find and reuse
    description: "Phase 1, Version 1. Diary search and filters, swap an exercise in the builder, a workout from a session"
  - title: 0.13 · Training plans
    description: "Phase 1, Version 1. Follow a plan"
  - title: 0.14 · Beyond the app
    description: "Phase 1, Version 1. Apple Health and Health Connect, choose what a device measures"
  - title: 0.15 · The admin, complete
    description: "Phase 1, Version 1. A super admin from environment variables, the catalog workspace closed"
  - title: 1.0 · Version 1 complete
    description: "Phase 1, Version 1. Whatever remains, then the first release that is not a pre-release"
  - title: After 1.0 · Stores
    description: "Phase 2, After 1.0. Apple Developer membership, TestFlight, App Store, Google Play"
  - title: After 1.0 · Website sessions
    description: "Phase 2, After 1.0. Plan, review and run guided sessions in the browser"
  - title: After 1.0 · Accounts and calendars
    description: "Phase 2, After 1.0. Sign in with Apple and Google, training days in other calendars"
  - title: After 1.0 · Sharing and coaching
    description: "Phase 2, After 1.0. Library sync or copy, coach links, comments"
  - title: Later
    description: Wanted, not planned yet
