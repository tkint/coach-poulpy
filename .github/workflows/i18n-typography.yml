name: Translation typography

# Translators type plain apostrophes and spaces, in Fink or by hand; this fixes them on main
# after each merge, so nobody has to learn which space is non-breaking.
on:
  push:
    branches: [main]
    paths: ['i18n/messages/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Fix apostrophes and non-breaking spaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node i18n/typography.mjs
      - name: Commit the fixes, if any
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Fix the typography of the translations'
          git push
