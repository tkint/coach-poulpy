<main class="phone player" style="padding-bottom: var(--cp-space-xxl);">
  <div style="display: flex;">
    <button type="button" class="icon-button icon-button--filled" aria-label="Close"><MobileIcon name="x" :size="22" /></button>
  </div>

  <div class="player-step" id="first-step" style="gap: var(--cp-space-sm);">
    <span class="label">Lower body strength · 5 exercises</span>
    <h1 class="headline" style="font: var(--cp-type-display);">Ready?</h1>
    <img src="../../../poulpy/pose_standing_tall.svg" alt="Poulpy standing tall" style="width: 260px; height: 234px; margin: var(--cp-space-lg) 0;">
    <span class="label label--primary">First up</span>
    <span class="title">Goblet squat</span>
    <span class="muted numbers" style="font-size: 17px; line-height: 24px; font-weight: 600;">4 × 8 reps · 16 kg · rest 90 s</span>
  </div>

  <MobileButton size="lg" icon="play">Start the session</MobileButton>
</main>
