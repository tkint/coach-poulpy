<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · choose a new password</title>
<meta name="mockup:screen" content="account-reset-password">
<meta name="mockup:section" content="Accounts">
<meta name="mockup:issue" content="310">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/ui/src/tokens.css">
<link rel="stylesheet" href="../../../../web/ui/poulpy-ui.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body class="bg-base-100 text-base-content min-h-screen">
<header class="mx-auto flex max-w-5xl items-center gap-2 px-4 pt-6 md:px-8" data-component="site-header">
  <img src="../../../poulpy/mood_happy.svg" alt="" width="36" height="36">
  <span class="cp-type-headline">Coach <span class="text-primary">poulpy</span></span>
</header>
<main class="mx-auto grid max-w-5xl items-center gap-8 px-4 py-10 md:grid-cols-2 md:gap-16 md:px-8 md:py-24" id="reset-password">
  <img src="../../../poulpy/pose_standing_tall.svg" alt="" width="320" height="290" class="w-40 justify-self-center md:w-80">
  <div class="flex max-w-md flex-col gap-6">
    <div class="flex flex-col gap-2">
      <h1 class="cp-type-display">Choose a new password</h1>
      <p>Every phone signed in to this account will be signed out.</p>
    </div>
    <form class="flex flex-col gap-6" id="new-password-form">
      <div class="cp-fieldset" data-component="password-field" id="new-password-field">
        <label class="cp-type-label" for="new-password">New password</label>
        <label class="cp-input w-full">
          <input id="new-password" type="password" class="grow" value="a new horse battery" autocomplete="new-password" aria-describedby="new-password-hint">
          <button type="button" class="cp-btn cp-btn-circle cp-btn-ghost cp-btn-sm" aria-label="Show password" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button>
        </label>
        <span class="cp-label" id="new-password-hint">8 characters or more.</span>
      </div>
      <a class="cp-btn cp-btn-xl cp-btn-primary w-full" data-component="button" href="account-reset-password-saved.html">Save password</a>
    </form>
  </div>
</main>
</body>
</html>
