name: Deploy

# Run by hand: Actions > Deploy > Run workflow. It writes the app's .env from the chosen GitHub
# environment, uploads it with the server and shared Caddy files of the selected branch over SSH and
# deploys a server image (ADR 0019). The version "branch" builds the selected branch's server image
# first, to try a pull request before it merges. Setup and secrets: docs/releasing.md, "Deploy the
# server".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        options: [production, preview]
        default: production
      version:
        description: "Server image: latest, a version such as 0.3.0, or branch to build the selected branch"
        default: latest
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Update the server
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Pick the image
        id: image
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$VERSION" = branch ]; then
            # A branch has no published image: it is built below, tagged with the branch's name.
            VERSION="branch-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-100)"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid image version."; exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5

      - if: inputs.version == 'branch'
        uses: docker/setup-buildx-action@v3
      - if: inputs.version == 'branch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.version == 'branch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          # The machine is amd64 (ADR 0019), as in the Release workflow.
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.image.outputs.tag }}
          tags: ghcr.io/${{ github.repository_owner }}/coach-poulpy-server:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the machine
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
          HOST_KEY: ${{ vars.DEPLOY_HOST_KEY || secrets.DEPLOY_HOST_KEY }}
          VERSION: ${{ steps.image.outputs.tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          # Written to the app's .env on the server.
          DOMAIN: ${{ vars.DOMAIN }}
          # Names the folder, the Compose project, the server's alias and its Caddy route: another
          # name runs beside production, the same name replaces it.
          APP_NAME: ${{ vars.APP_NAME || 'coach-poulpy' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          for name in DEPLOY_SSH_KEY:SSH_KEY DEPLOY_HOST:HOST DEPLOY_USER:SSH_USER \
            DEPLOY_HOST_KEY:HOST_KEY DOMAIN:DOMAIN POSTGRES_PASSWORD:POSTGRES_PASSWORD; do
            if [ -z "$(printenv "${name#*:}")" ]; then
              echo "::error::Missing ${name%%:*} in the $ENVIRONMENT environment."; exit 1
            fi
          done
          if ! printf '%s' "$APP_NAME" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "::error::APP_NAME may only have lowercase letters, digits and dashes."; exit 1
          fi

          umask 077
          printf 'APP_NAME=%s\nDOMAIN=%s\nIMAGE_TAG=%s\nPOSTGRES_PASSWORD=%s\n' \
            "$APP_NAME" "$DOMAIN" "$VERSION" "$POSTGRES_PASSWORD" > "$RUNNER_TEMP/.env"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          remote() {
            ssh -i "$RUNNER_TEMP/key" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" "$SSH_USER@$HOST" "$1"
          }

          tar -C deploy/caddy -czf - compose.yaml bootstrap.json deploy.py | remote 'mkdir -p ~/caddy && tar -xzf - -C ~/caddy'
          tar -C deploy -czf - compose.yaml coach-poulpy.caddy -C "$RUNNER_TEMP" .env |
            remote "mkdir -p ~/$APP_NAME && tar -xzf - -C ~/$APP_NAME"
          remote "python3 ~/caddy/deploy.py ~/$APP_NAME compose.yaml coach-poulpy.caddy"
