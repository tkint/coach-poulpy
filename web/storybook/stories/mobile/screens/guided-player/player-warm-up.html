<main class="phone player">
  <div class="session-progress" id="session-progress">
    <button class="icon-button icon-button--filled" type="button" aria-label="Pause"><MobileIcon name="pause" :size="20" /></button>
    <div>
      <span class="label numbers">Step 2 of 25 · 00:41</span>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="25" aria-valuenow="2" aria-label="Session progress"><div style="width: 8%;"></div></div>
    </div>
    <button type="button" class="icon-button icon-button--filled" aria-label="End session"><MobileIcon name="x" :size="22" /></button>
  </div>

  <div class="player-step" id="current-step">
    <img src="../../../poulpy/pose_straining.svg" alt="Poulpy straining">
    <span class="part-line" id="part-line" data-component="part-line"><MobileIcon name="sun" :size="16" />Warm-up</span>
    <h1 class="title">Air squat</h1>
    <span class="no-dots" aria-hidden="true"></span>
    <span class="target-value">10</span>
    <span class="target-unit">reps</span>
  </div>

  <MobileNextCard id="next-step" label="Next">Work 1 · Goblet squat</MobileNextCard>

  <div class="player-actions">
    <MobileButton kind="secondary" size="lg">Skip</MobileButton>
    <MobileButton size="lg" icon="check">Done</MobileButton>
  </div>
</main>
