<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder · strength</title>
<meta name="mockup:screen" content="builder-strength">
<meta name="mockup:section" content="Builder">
<meta name="mockup:issue" content="104">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">
<header class="top-bar" style="padding: var(--cp-space-xxxl) var(--cp-space-md) var(--cp-space-sm); justify-content: flex-start; gap: var(--cp-space-xs);">
    <a class="icon-button" href="home-planned.html" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 class="headline" style="flex: 1;">New workout</h1>
    <a class="small-button" data-component="primary-button" href="#">Save</a>
  </header>

  <div class="form-body">
    <label class="field">
      <span class="label">Name</span>
      <input class="text-field" type="text" value="Lower body strength">
    </label>
    <div class="field">
      <span class="label">Kind of workout</span>
      <div class="chip-row chip-row--wrap" role="group" aria-label="Kind of workout">
        <button class="filter-chip" data-component="filter-chip" type="button" aria-pressed="true">Strength</button>
        <button class="filter-chip" data-component="filter-chip" type="button" aria-pressed="false">Conditioning</button>
        <button class="filter-chip" data-component="filter-chip" type="button" aria-pressed="false">Mobility</button>
        <button class="filter-chip" data-component="filter-chip" type="button" aria-pressed="false">Rehab</button>
      </div>
    </div>

    <section class="builder-step builder-step--open" id="step-1" data-component="builder-step" aria-label="Goblet squat">
      <div class="builder-step-header">
        <span class="drag-handle" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
        <span class="row-text"><strong>Goblet squat</strong></span>
        <button class="icon-button" type="button" aria-label="Remove Goblet squat" style="color: var(--cp-on-surface-variant);"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
      <div class="steppers">
        <div class="stepper" data-component="stepper">
          <span class="label">Sets</span>
          <div><button type="button" aria-label="Fewer sets">−</button><strong>4</strong><button type="button" aria-label="More sets">+</button></div>
        </div>
        <div class="stepper" data-component="stepper">
          <span class="label">Each set</span>
          <div><button type="button" aria-label="Fewer reps">−</button><strong>8 reps</strong><button type="button" aria-label="More reps">+</button></div>
        </div>
        <div class="stepper" data-component="stepper">
          <span class="label">Rest after</span>
          <div><button type="button" aria-label="Shorter rest">−</button><strong>90 s</strong><button type="button" aria-label="Longer rest">+</button></div>
        </div>
        <label class="stepper" data-component="stepper">
          <span class="label">Weight</span>
          <span style="height: 44px; display: flex; align-items: center; gap: var(--cp-space-xs);"><input type="text" inputmode="decimal" value="16" aria-label="Weight in kilograms"><span style="font-weight: 700; color: var(--cp-on-surface-variant);">kg</span></span>
        </label>
      </div>
    </section>

    <section class="builder-step" data-component="builder-step" aria-label="Romanian deadlift">
      <div class="builder-step-header">
        <span class="drag-handle" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
        <span class="row-text"><strong>Romanian deadlift</strong><span>3 × 10 · 20 kg · rest 90 s</span></span>
        <button class="icon-button" type="button" aria-label="Edit Romanian deadlift" style="color: var(--cp-on-surface-variant);"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </section>
    <section class="builder-step" data-component="builder-step" aria-label="Reverse lunge">
      <div class="builder-step-header">
        <span class="drag-handle" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
        <span class="row-text"><strong>Reverse lunge</strong><span>3 × 8 each side · rest 60 s</span></span>
        <button class="icon-button" type="button" aria-label="Edit Reverse lunge" style="color: var(--cp-on-surface-variant);"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </section>

    <a class="add-button" data-component="add-step-button" href="library-exercises.html"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Add an exercise</a>
  </div>
</main>
</body>
</html>
