<main class="phone player player--paused">
  <div class="session-progress" id="session-progress">
    <button class="pause-button pause-button--paused" data-component="pause-button" id="pause-button" type="button" aria-label="Resume"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="play"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></button>
    <div>
      <span class="label numbers">Step 3 of 6 · 14:20</span>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="3" aria-label="Session progress"><div style="width: 50%;"></div></div>
    </div>
    <button type="button" class="icon-button icon-button--filled" aria-label="End session"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="paused-card" id="paused" data-component="paused-card" role="status"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="pause"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg><strong>Paused</strong></div>
  <section class="live-numbers" id="live-numbers" aria-label="Live numbers" data-component="live-numbers">
    <div class="live-tile live-tile--small"><span class="label">Heart rate <span>· band</span></span><span class="value">121 <small>bpm</small></span></div>
  </section>

  <div class="player-step" id="current-step">
    <img src="../../../poulpy/pose_straining.svg" alt="Poulpy straining">
    <span class="part-line" id="part-line" data-component="part-line">Work</span>
    <h1 class="title">Bodyweight squats</h1>
    <span class="set-count numbers">Set 2 of 3</span>
    <div class="set-dots" aria-hidden="true"><span class="done"></span><span class="current"></span><span></span></div>
    <span class="target-value">15</span>
    <span class="target-unit">reps</span>
  </div>
  <MobileNextCard id="next-step" label="Next">Rest 1 min, then set 3</MobileNextCard>
  <div class="player-actions">
    <MobileButton kind="secondary" large disabled>Skip</MobileButton>
    <button type="button" class="primary-button primary-button--large" data-component="primary-button" aria-disabled="true">Done</button>
  </div>
</main>
