<main class="phone" style="--frame-height: 1320px">
<header class="top-bar" style="padding: var(--cp-space-xxxl) var(--cp-space-md) var(--cp-space-sm); justify-content: flex-start; gap: var(--cp-space-xs);">
    <button type="button" class="icon-button" aria-label="Close"><MobileIcon name="x" :size="22" /></button>
    <h1 class="headline" style="flex: 1;">New workout</h1>
    <MobileButton size="sm">Save</MobileButton>
  </header>

  <div class="page-body">
    <label class="field">
      <span class="label">Name</span>
      <input class="text-field" type="text" value="Upper body">
    </label>
    <div class="format-line" id="format" data-component="format-line">
      <span class="label">Format</span>
      <button type="button" class="format-control" data-component="format-control" aria-haspopup="dialog" aria-label="Format: Sets. Change it"><MobileFormatChip icon="list">Sets</MobileFormatChip><MobileIcon name="chevron-down" :size="16" /></button>
    </div>
    <section class="part" id="warm-up" data-component="part" aria-labelledby="warm-up-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon" aria-hidden="true"><MobileIcon name="sun" :size="20" /></span>
        <div><h2 id="warm-up-name">Warm-up</h2><p>2 steps · about 6 min</p></div>
        <button class="part-add" type="button" data-component="part-add" aria-label="Add to warm-up"><MobileIcon name="plus" :size="20" /></button>
        <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Warm-up"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
      </div>
      <ol class="steps" data-reorder>
        <li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Walk"><span class="step-number" aria-hidden="true">1</span><span class="step-text"><strong>Walk</strong><span>5 min</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Walk"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li><li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Arm circle"><span class="step-number" aria-hidden="true">2</span><span class="step-text"><strong>Arm circle</strong><span>30 s</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Arm circle"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li>
      </ol>
    </section>
    <section class="part" id="work-1" data-component="part" aria-labelledby="work-1-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon part-icon--work" aria-hidden="true"><MobileIcon name="zap" :size="20" /></span>
        <div><h2 id="work-1-name">Work 1</h2><p>3 exercises · about 18 min</p></div>
        <button class="part-add" type="button" data-component="part-add" aria-label="Add to Work 1"><MobileIcon name="plus" :size="20" /></button>
        <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Work 1"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
      </div>
      <ol class="steps" data-reorder>
        <li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Goblet squat"><span class="step-number" aria-hidden="true">3</span><span class="step-text"><strong>Goblet squat</strong><span>3 × 8 · 40 kg · 2 min between sets</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Goblet squat"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li><li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Bent-over row"><span class="step-number" aria-hidden="true">4</span><span class="step-text"><strong>Bent-over row</strong><span>3 × 10 · 30 kg · 1 min 30 s between sets</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Bent-over row"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li><li><section class="repeat" data-component="repeat" aria-label="Repeat 3 times">
          <div class="repeat-header"><MobileIcon name="repeat" :size="20" /><strong>Repeat</strong>
            <span class="repeat-count" role="group" aria-label="Number of times"><button type="button" aria-label="Fewer times">−</button><span>3 times</span><button type="button" aria-label="More times">+</button></span>
            <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for this repeat"><MobileIcon name="ellipsis-vertical" :size="20" /></button></div>
          <ol class="steps">
        <li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Biceps curl"><span class="step-number" aria-hidden="true">5</span><span class="step-text"><strong>Biceps curl</strong><span>12 reps · 10 kg</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Biceps curl"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li><li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Triceps dip"><span class="step-number" aria-hidden="true">6</span><span class="step-text"><strong>Triceps dip</strong><span>12 reps</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Triceps dip"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li><li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Rest"><span class="step-number step-number--rest" aria-hidden="true"><MobileIcon name="timer" :size="18" /></span><span class="step-text"><MobileRoleTag>Recover</MobileRoleTag><strong>Rest</strong><span>1 min</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Rest"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li>
          </ol>
        </section></li>
      </ol>
    </section>
    <section class="part" id="work-2" data-component="part" aria-labelledby="work-2-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon part-icon--work" aria-hidden="true"><MobileIcon name="zap" :size="20" /></span>
        <div><h2 id="work-2-name">Work 2</h2><p>2 exercises · about 7 min</p></div>
        <button class="part-add" type="button" data-component="part-add" aria-label="Add to Work 2"><MobileIcon name="plus" :size="20" /></button>
        <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Work 2"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
      </div>
      <ol class="steps" data-reorder>
        <li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Plank"><span class="step-number" aria-hidden="true">7</span><span class="step-text"><strong>Plank</strong><span>40 s hold</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Plank"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li><li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Crunch"><span class="step-number" aria-hidden="true">8</span><span class="step-text"><strong>Crunch</strong><span>15 reps</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Crunch"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li>
      </ol>
    </section>
    <section class="part" id="cool-down" data-component="part" aria-labelledby="cool-down-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon" aria-hidden="true"><MobileIcon name="moon" :size="20" /></span>
        <div><h2 id="cool-down-name">Cool down</h2><p>1 step · 1 min</p></div>
        <button class="part-add" type="button" data-component="part-add" aria-label="Add to cool down"><MobileIcon name="plus" :size="20" /></button>
        <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Cool down"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
      </div>
      <ol class="steps" data-reorder>
        <li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Chest stretch"><span class="step-number" aria-hidden="true">9</span><span class="step-text"><strong>Chest stretch</strong><span>30 s hold · each side</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Chest stretch"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li>
      </ol>
    </section>
    <button type="button" class="text-link" data-component="add-part-link"><MobileIcon name="plus" :size="20" />Add a part</button>
  </div>
</main>
