<main class="phone" style="--frame-height: 1040px">
<header class="top-bar" style="padding: var(--cp-space-xxxl) var(--cp-space-md) var(--cp-space-sm); justify-content: flex-start; gap: var(--cp-space-xs);">
    <button type="button" class="icon-button" aria-label="Close"><MobileIcon name="x" :size="22" /></button>
    <h1 class="headline" style="flex: 1;">New workout</h1>
    <MobileButton size="sm">Save</MobileButton>
  </header>

  <div class="page-body builder-body">
    <label class="field">
      <span class="label">Name</span>
      <input class="text-field" type="text" value="Easy run and 400 m">
    </label>
    <div class="format-line" id="format" data-component="format-line">
      <span class="label">Format</span>
      <button type="button" class="format-control" data-component="format-control" aria-haspopup="dialog" aria-label="Format: Circuit. Change it"><MobileFormatChip icon="repeat">Circuit</MobileFormatChip><MobileIcon name="chevron-down" :size="16" /></button>
    </div>
    <fieldset class="recap-part builder-block" id="warm-up" data-component="recap-part" aria-label="Warm-up">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon" aria-hidden="true"><MobileIcon name="sun" :size="20" /></span><div><h2>Warm-up</h2><p>1 exercise · about 12 min</p></div></div></legend>
          <ol class="steps" data-reorder><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="footprints" :size="18" /></span><span class="row-text"><strong>Run</strong><span>2 km · 6:00 /km</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Run"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li></ol>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to warm-up"><MobileIcon name="plus" :size="20" /></button>
        </fieldset>
    <fieldset class="recap-part builder-block" id="work" data-component="recap-part" aria-label="Work">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon part-icon--work" aria-hidden="true"><MobileIcon name="zap" :size="20" /></span><div><h2>Work</h2><p>1 exercise · about 20 min</p></div></div></legend>
          <ol class="steps" data-reorder><li><section class="repeat" data-component="repeat" aria-label="Repeat 6 times">
              <div class="repeat-header"><MobileIcon name="repeat" :size="20" /><strong>Repeat</strong>
                <span class="repeat-count" role="group" aria-label="Number of times"><button type="button" aria-label="Fewer times">−</button><span>6 times</span><button type="button" aria-label="More times">+</button></span>
                <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for this repeat"><MobileIcon name="ellipsis-vertical" :size="20" /></button></div>
              <ol class="steps"><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="footprints" :size="18" /></span><span class="row-text"><strong>Run</strong><span>400 m · 4:30 /km</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Run"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="footprints" :size="18" /></span><span class="row-text"><MobileRoleTag>Recover</MobileRoleTag><strong>Walk</strong><span>1 min 30 s</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Walk"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li></ol>
            </section></li></ol>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to Work"><MobileIcon name="plus" :size="20" /></button>
        </fieldset>
    <fieldset class="recap-part builder-block" id="cool-down" data-component="recap-part" aria-label="Cool down">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon" aria-hidden="true"><MobileIcon name="moon" :size="20" /></span><div><h2>Cool down</h2><p>1 exercise · until the end</p></div></div></legend>
          <ol class="steps" data-reorder><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="footprints" :size="18" /></span><span class="row-text"><strong>Walk</strong><span>until the end</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Walk"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li></ol>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to cool down"><MobileIcon name="plus" :size="20" /></button>
        </fieldset>
  </div>

  <div class="scrim" aria-hidden="true"></div>
  <MobileSheet id="edit-run" aria-label="Edit Run" style="gap: var(--cp-space-md);">
    <span class="sheet-handle" aria-hidden="true"></span>
    <div class="sheet-title"><h2>Run</h2><p>In Warm-up · about 12 min</p></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--cp-space-sm);"><MobileSelectField label="Step" value="Exercise" opens="list" style="grid-column: span 2;" /><MobileSelectField label="Duration" value="Distance" opens="list" /><MobileSelectField label="Intensity" value="Pace" opens="list" /></div>
    <div class="steppers" style="grid-template-columns: 1fr;">
      <div class="stepper" data-component="stepper">
        <span class="label">Distance</span>
        <div><button type="button" aria-label="Shorter">−</button><button type="button" class="value-link" aria-label="Set distance, 2.0 km">2.0 km</button><button type="button" aria-label="Longer">+</button></div>
      </div>
      <div class="stepper" data-component="stepper">
        <span class="label">Pace</span>
        <div><button type="button" aria-label="Slower pace">−</button><button type="button" class="value-link" aria-label="Set pace, 6:00 per km">6:00 /km</button><button type="button" aria-label="Faster pace">+</button></div>
      </div>
    </div>
    <span class="hint">≈ 10.0 km/h · about 12 min · tap a value to type it</span>
    <MobileButton size="md">Done</MobileButton>
  </MobileSheet>
</main>
