<main class="phone">
<MobileTopBar title="Library" />
<div class="screen-header" style="padding-top: 0; padding-bottom: var(--cp-space-sm); gap: var(--cp-space-md);">
    <MobileTabs aria-label="Library" :tabs="['Workouts', 'Exercises']" selected="Exercises" />
    <MobileSearchField label="Search exercises" placeholder="Name, muscle, mobility or floor" />
    <div class="chip-row" role="group" aria-label="Filters">
      <MobileFilterChip icon="dumbbell" have :count="2" aria-haspopup="dialog" aria-label="Equipment, 2 ticked" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="target" have :count="1" aria-haspopup="dialog" aria-label="Focus, 1 ticked" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="armchair" have :count="1" aria-haspopup="dialog" aria-label="Position, 1 ticked" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      
      <MobileFilterChip icon="person-standing" have :count="2" aria-haspopup="dialog" aria-label="Zones, 2 ticked" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="tag" aria-haspopup="dialog" aria-label="Tags" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
    </div>
  </div>

  <div class="list-meta"><span aria-live="polite">9 exercises</span><button class="clear-link" type="button">Clear filters</button></div>

  <div id="catalog" style="flex: 1; min-height: 0; overflow: hidden; padding: 0 var(--cp-space-lg) var(--cp-space-lg); display: flex; flex-direction: column; gap: 6px;">
    <h2 class="label" style="margin: 10px var(--cp-space-xs) 2px;">Mobility</h2>
    <ul style="display: flex; flex-direction: column; gap: var(--cp-space-sm);">
      <li><MobileExerciseRow link icon="hand-grab" name="Cat-cow" detail="Back, core · On the floor · Mat" /></li>
      <li><MobileExerciseRow link icon="hand-grab" name="Clamshell" detail="Glutes, hips · On the floor · Each side" /></li>
      <li><MobileExerciseRow link icon="hand-grab" name="World's greatest stretch" detail="Hips, back · On the floor · Each side" /></li>
      <li><MobileExerciseRow link icon="hand-grab" name="Child's pose" detail="Back, hips · On the floor · Hold" /></li>
    </ul>
  </div>

  <MobileNavBar active="library" />
  <div class="scrim" aria-hidden="true"></div>
  <MobileSheet id="focus-sheet" aria-modal="true" aria-label="Focus">
    <span class="sheet-handle" aria-hidden="true"></span>
    <div class="sheet-title"><h2>Focus</h2><p>What the exercise is for. Tick several to widen the list.</p></div>
    <div class="check-list">
        <label><input type="checkbox"><span>Strength</span><span>31 exercises</span></label>
        <label><input type="checkbox"><span>Cardio</span><span>14 exercises</span></label>
        <label><input type="checkbox" checked><span>Mobility</span><span>9 exercises</span></label>
        <label><input type="checkbox"><span>Stretching</span><span>8 exercises</span></label>
        <label><input type="checkbox"><span>Warm-up</span><span>16 exercises</span></label>
        <label><input type="checkbox"><span>Cool down</span><span>12 exercises</span></label>
    </div>
    <div class="sheet-actions"><MobileButton kind="secondary" size="xl">Clear</MobileButton><MobileButton size="xl">Show 9 exercises</MobileButton></div>
  </MobileSheet>
</main>
