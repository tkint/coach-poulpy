<main class="phone" style="--frame-height: 640px">
<header class="top-bar" style="padding: var(--cp-space-xxxl) var(--cp-space-md) var(--cp-space-sm); justify-content: flex-start; gap: var(--cp-space-xs);">
    <button type="button" class="icon-button" aria-label="Close"><MobileIcon name="x" :size="22" /></button>
    <h1 class="headline" style="flex: 1;">New workout</h1>
    <MobileButton size="sm">Save</MobileButton>
  </header>

  <div class="page-body builder-body">
    <label class="field"><span class="label">Name</span><input class="text-field" type="text" placeholder="Name your workout"></label>
    <div class="format-line" id="format" data-component="format-line"><span class="label">Format</span>
      <button type="button" class="format-control" data-component="format-control" aria-haspopup="dialog" aria-label="Format: Sets. Change it"><span class="format-pill"><MobileIcon name="list" :size="18" /><strong>Sets</strong><MobileIcon name="chevron-down" :size="16" /></span></button></div>
    <fieldset class="recap-part builder-block" id="warm-up" data-component="recap-part" aria-label="Warm-up">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon" aria-hidden="true"><MobileIcon name="sun" :size="20" /></span><div><h2>Warm-up</h2><p>Optional</p></div></div></legend>
          <button type="button" class="block-empty" data-component="block-empty" aria-label="Add to warm-up">Nothing planned. Tap to add an exercise.</button>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to warm-up"><MobileIcon name="plus" :size="16" /></button>
        </fieldset>
    <fieldset class="recap-part builder-block" id="work" data-component="recap-part" aria-label="Work">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon part-icon--work" aria-hidden="true"><MobileIcon name="zap" :size="20" /></span><div><h2>Work</h2><p>Nothing yet</p></div></div></legend>
          <button type="button" class="block-empty" data-component="block-empty" aria-label="Add to Work">Tap to add an exercise.</button>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to Work"><MobileIcon name="plus" :size="16" /></button>
        </fieldset>
    <fieldset class="recap-part builder-block" id="cool-down" data-component="recap-part" aria-label="Cool down">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon" aria-hidden="true"><MobileIcon name="moon" :size="20" /></span><div><h2>Cool down</h2><p>Optional</p></div></div></legend>
          <button type="button" class="block-empty" data-component="block-empty" aria-label="Add to cool down">Nothing planned. Tap to add an exercise.</button>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to cool down"><MobileIcon name="plus" :size="16" /></button>
        </fieldset>
  </div>
</main>
