<main class="phone">
  <MobileTopBar title="Account" leading="back" back-label="Back to profile" />
  <div class="form-body" style="padding-top: var(--cp-space-lg);">
    <div class="card account-card" id="account-guest" data-component="account-card"><span class="label">Guest</span><strong>Your training is on this phone only.</strong></div>
    <section class="card" id="follows" data-component="info-card"><h2 class="headline" style="font-size: 17px; line-height: 22px;">With an account</h2><p class="muted" style="font-size: 14px; line-height: 20px; margin-top: 4px;">Your training is backed up and you can use it on other phones. Nothing changes until you choose.</p></section>
    <div class="leave-actions">
      <MobileButton kind="primary" size="md" icon="circle-plus" id="create-account">Create an account</MobileButton>
      <MobileButton kind="secondary" size="md" icon="log-in" id="sign-in">Sign in</MobileButton>
    </div>
  </div>
</main>
