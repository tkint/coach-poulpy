<main class="phone player" style="padding-top: 64px; gap: 20px;">
  <div class="player-step" id="summary" style="gap: 6px;">
    <MobilePoulpyCheer id="champion-jump" label="Poulpy, champion, jumping for joy" />
    <h1 style="font: var(--cp-type-display);">Champion!</h1>
    <p class="headline" style="font-weight: 600; font-size: 19px; line-height: 23px; color: var(--cp-primary);">“Eight tentacles. No regrets.”</p>
    <p class="muted" id="workout-name" style="margin-top: var(--cp-space-sm); font-weight: 800; color: var(--cp-on-surface);">Lower body strength</p>
    <p class="muted numbers" id="session-date">Sat 24 Oct · 18:05</p>
    <p class="muted numbers">18 of 18 sets done in 41:02</p>
  </div>

  <div class="stat-tiles" id="session-totals">
    <div class="stat-tile"><span class="label">Time</span><strong>41:02</strong></div>
    <div class="stat-tile"><span class="label">Sets</span><strong>18</strong></div>
    <div class="stat-tile"><span class="label">Lifted</span><strong>2.3 t</strong></div>
  </div>

  <MobilePoulpyCard id="tentacle-lit" aria-label="All tentacles lit" title="All eight tentacles lit!" compact>
    <template #art><MobileTentacleRing :lit="8" fresh :size="64" label="8 of 8 tentacles lit" /></template>
    A new ring starts with your next session.
  </MobilePoulpyCard>

  <div style="display: flex; flex-direction: column; gap: var(--cp-space-sm);" id="finished-actions">
    <MobileButton kind="secondary" large icon="share-2" id="share-session">Share as an image</MobileButton>
    <MobileButton large>Close</MobileButton>
  </div>
</main>
