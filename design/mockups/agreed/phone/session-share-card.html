<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session share card</title>
<meta name="mockup:screen" content="session-share-card">
<meta name="mockup:section" content="Session summary">
<meta name="mockup:issue" content="125">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
<style>
  /* The card is a 4:5 picture (1080 x 1350), shown here at a quarter of its size. It looks like the finished screen and follows the theme in use, light or dark. */
  .share-stage { display: flex; flex-wrap: wrap; gap: var(--cp-space-xxl); justify-content: center; padding: var(--cp-space-xxl) var(--cp-space-lg); }
  .share-card {
    width: 270px; height: 337px; overflow: hidden; box-sizing: border-box; padding: 10px 22px 10px;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--cp-space-xs);
    border-radius: 12px; background: var(--cp-background); color: var(--cp-on-background, var(--cp-on-surface)); border: 1px solid var(--cp-outline);
    font-family: var(--cp-font-body);
  }
  .share-card img { width: 64px; height: 58px; }
  .share-card h2 { margin: 0; font-family: var(--cp-font-display); font-size: 22px; line-height: 26px; font-weight: 800; }
  .share-card .name { margin: 0; font-size: 14px; font-weight: 800; }
  .share-card .date { margin: 0; font-size: 11px; font-weight: 600; color: var(--cp-on-surface-variant); }
  .share-card dl { margin: 2px 0 0; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .share-card dl.two { grid-template-columns: 1fr 1fr; }
  .share-card dl div { background: var(--cp-surface); color: var(--cp-on-surface); border: 1px solid var(--cp-outline); border-radius: var(--cp-radius-sm); padding: var(--cp-space-xs) var(--cp-space-sm); display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
  .share-card dt { color: var(--cp-on-surface-variant); font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .share-card dd { margin: 0; font-family: var(--cp-font-display); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .share-card .lit-card { width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: var(--cp-space-sm); text-align: left; padding: var(--cp-space-sm); border-radius: var(--cp-radius-sm); background: var(--cp-primary-container); color: var(--cp-on-primary-container); }
  .share-card .lit-card .tentacle-ring { width: 42px; height: 42px; }
  .share-card .lit-card strong { display: block; font-family: var(--cp-font-display); font-size: 13px; line-height: 15px; }
  .share-card .lit-card span { font-size: 9px; font-weight: 600; line-height: 11px; }
  .share-card footer { color: var(--cp-primary); margin-top: auto; font-family: var(--cp-font-display); font-size: 13px; font-weight: 700; }
  .share-stage figure { margin: 0; display: flex; flex-direction: column; gap: var(--cp-space-sm); align-items: center; }
  .share-stage figcaption { font-size: 13px; max-width: 270px; text-align: center; color: var(--cp-on-surface-variant); }
</style>
</head>
<body>
<div class="share-stage">
  <figure>
    <article class="share-card" id="card-workout" data-component="share-card" aria-label="Share card, weights workout">
      <img src="../../../poulpy/pose_exhausted.svg" alt="Poulpy exhausted with a sweatband">
      <h2>Well done!</h2>
      <p class="name">Lower body strength</p>
      <p class="date">Sat 24 Oct · 18:05</p>
      <p class="date">17 of 18 sets done in 38:24 · 1 skipped</p>
      <dl>
        <div><dt>Time</dt><dd>38:24</dd></div>
        <div><dt>Sets</dt><dd>17</dd></div>
        <div><dt>Lifted</dt><dd>2.1 t</dd></div>
      </dl>
      <div class="lit-card"><div class="tentacle-ring"><svg viewBox="0 0 200 200" aria-hidden="true"><path class="lit" d="M117.9 15.9 A86 86 0 0 1 146.8 27.9"/><path class="lit" d="M172.1 53.2 A86 86 0 0 1 184.1 82.1"/><path class="lit" d="M184.1 117.9 A86 86 0 0 1 172.1 146.8"/><path class="lit" d="M146.8 172.1 A86 86 0 0 1 117.9 184.1"/><path class="lit" d="M82.1 184.1 A86 86 0 0 1 53.2 172.1"/><path class="lit" d="M27.9 146.8 A86 86 0 0 1 15.9 117.9"/><path class="lit new" d="M15.9 82.1 A86 86 0 0 1 27.9 53.2"/><path d="M53.2 27.9 A86 86 0 0 1 82.1 15.9"/></svg></div><div><strong>Tentacle 7 lit!</strong><span>One more and Poulpy is a champion.</span></div></div>
      <footer>Coach Poulpy</footer>
    </article>
    <figcaption>The finished screen as a picture: same Poulpy, same words, same tiles. Shared straight after the session or from the history, it is the same picture.</figcaption>
  </figure>
  <figure>
    <article class="share-card" id="card-run" data-component="share-card" aria-label="Share card, run">
      <img src="../../../poulpy/pose_exhausted.svg" alt="Poulpy exhausted with a sweatband">
      <h2>Well done!</h2>
      <p class="name">Easy run and 400 m</p>
      <p class="date">Sun 25 Oct · 09:10</p>
      <p class="date">6 of 6 rounds done in 38:24</p>
      <dl>
        <div><dt>Time</dt><dd>38:24</dd></div>
        <div><dt>Distance</dt><dd>5.2 km</dd></div>
        <div><dt>Pace</dt><dd>7:23 /km</dd></div>
      </dl>
      <div class="lit-card"><div class="tentacle-ring"><svg viewBox="0 0 200 200" aria-hidden="true"><path class="lit" d="M117.9 15.9 A86 86 0 0 1 146.8 27.9"/><path class="lit" d="M172.1 53.2 A86 86 0 0 1 184.1 82.1"/><path class="lit" d="M184.1 117.9 A86 86 0 0 1 172.1 146.8"/><path class="lit" d="M146.8 172.1 A86 86 0 0 1 117.9 184.1"/><path class="lit" d="M82.1 184.1 A86 86 0 0 1 53.2 172.1"/><path class="lit" d="M27.9 146.8 A86 86 0 0 1 15.9 117.9"/><path class="lit new" d="M15.9 82.1 A86 86 0 0 1 27.9 53.2"/><path d="M53.2 27.9 A86 86 0 0 1 82.1 15.9"/></svg></div><div><strong>Tentacle 7 lit!</strong><span>One more and Poulpy is a champion.</span></div></div>
      <footer>Coach Poulpy</footer>
    </article>
    <figcaption>A run shows Time, Distance and Pace. Heart rate is never on the card. The picture follows the theme in use: switch the docs theme to see it dark.</figcaption>
  </figure>
</div>
</body>
</html>
