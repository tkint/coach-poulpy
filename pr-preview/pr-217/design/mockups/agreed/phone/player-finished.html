<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · finished</title>
<meta name="mockup:screen" content="player-finished">
<meta name="mockup:section" content="Guided player">
<meta name="mockup:issue" content="104">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone player" style="padding-top: 64px; gap: 20px;">
  <div class="player-step" id="summary" style="gap: 6px;">
    <img src="../../../poulpy/pose_exhausted.svg" alt="Poulpy exhausted with a sweatband" style="width: 170px; height: 153px; margin-bottom: var(--cp-space-xs);">
    <h1 style="font: var(--cp-type-display);">Well done!</h1>
    <p class="headline" style="font-weight: 600; font-size: 19px; line-height: 23px; color: var(--cp-primary);">“Worth it. Probably.”</p>
    <p class="muted" id="workout-name" style="margin-top: var(--cp-space-sm); font-weight: 800; color: var(--cp-on-surface);">Lower body strength</p>
    <p class="muted numbers" id="session-date">Sat 24 Oct · 18:05</p>
    <p class="muted numbers">17 of 18 sets done in 38:24 · 1 skipped</p>
  </div>

  <div class="stat-tiles" id="session-totals">
    <div class="stat-tile"><span class="label">Time</span><strong>38:24</strong></div>
    <div class="stat-tile"><span class="label">Sets</span><strong>17</strong></div>
    <div class="stat-tile"><span class="label">Lifted</span><strong>2.1 t</strong></div>
  </div>

  <section class="poulpy-card" id="tentacle-lit" data-component="poulpy-card" aria-label="Tentacle lit">
    <div class="tentacle-ring" style="width: 64px; height: 64px;">
      <svg viewBox="0 0 200 200" width="64" height="64" role="img" aria-label="7 of 8 tentacles lit"><path class="lit" d="M117.9 15.9 A86 86 0 0 1 146.8 27.9"/><path class="lit" d="M172.1 53.2 A86 86 0 0 1 184.1 82.1"/><path class="lit" d="M184.1 117.9 A86 86 0 0 1 172.1 146.8"/><path class="lit" d="M146.8 172.1 A86 86 0 0 1 117.9 184.1"/><path class="lit" d="M82.1 184.1 A86 86 0 0 1 53.2 172.1"/><path class="lit" d="M27.9 146.8 A86 86 0 0 1 15.9 117.9"/><path class="lit new" d="M15.9 82.1 A86 86 0 0 1 27.9 53.2"/><path d="M53.2 27.9 A86 86 0 0 1 82.1 15.9"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h2 style="font: var(--cp-type-headline);">Tentacle 7 lit!</h2>
      <p style="font-weight: 500;">One more and Poulpy is a champion.</p>
    </div>
  </section>

  <div style="display: flex; flex-direction: column; gap: var(--cp-space-sm);" id="finished-actions">
    <a class="secondary-button secondary-button--large" id="share-session" data-component="secondary-button" href="session-share-card.html">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      Share as an image
    </a>
    <a class="primary-button primary-button--large" data-component="primary-button" href="home-done.html">Close</a>
  </div>
</main>
</body>
</html>
