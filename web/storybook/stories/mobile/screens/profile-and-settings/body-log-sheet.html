<main class="phone">

  <header class="page-bar"><button type="button" class="icon-button" aria-label="Back to weight"><MobileIcon name="chevron-left" :size="22" /></button><div><h1>Weight</h1></div></header>
  <div class="scrim"></div>
  <MobileSheet id="log-sheet" aria-label="Log your weight">
    <span class="sheet-handle"></span>
    <div class="sheet-title"><h2>Log your weight</h2><p>Type it, or nudge it with − and +. Stored in kilograms, shown in your units.</p></div>
    <div class="number-entry" data-component="number-entry"><button type="button" aria-label="Less">−</button><span class="number-field number-field--large"><input inputmode="decimal" value="72.6" aria-label="Weight" autofocus><span class="unit">kg</span></span><button type="button" aria-label="More">+</button></div>
    <MobileSelectField label="Date" value="Today, 1 November" />
    <div class="sheet-actions"><MobileButton kind="secondary" size="xl">Cancel</MobileButton><MobileButton size="xl" style="flex: 1;">Save</MobileButton></div>
  </MobileSheet>
</main>
