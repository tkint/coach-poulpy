<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise page</title>
<meta name="mockup:screen" content="exercise-page">
<meta name="mockup:section" content="Exercises">
<meta name="mockup:issue" content="104">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">
<div id="exercise-picture" style="height: 260px; flex: none; background: var(--cp-primary-container); color: var(--cp-on-primary-container); position: relative; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; left: var(--cp-space-lg); right: var(--cp-space-lg); top: var(--cp-space-xxxl); display: flex; justify-content: space-between; align-items: center;">
      <a class="icon-button icon-button--filled" href="library-exercises.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></a>
      <button type="button" id="variations" data-component="variation-button" aria-haspopup="dialog" aria-label="Variations, 3 of 5, easiest first" style="height: 44px; padding: 0 var(--cp-space-md) 0 14px; border-radius: var(--cp-radius-pill); background: var(--cp-surface); color: var(--cp-on-primary-container); font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: var(--cp-space-sm);"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"><path d="M5 19v-3M10 19v-7M15 19v-11M20 19V4"/></svg>Variation 3 of 5<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div role="img" aria-label="Exercise picture placeholder" style="margin-top: 36px; width: 180px; height: 140px; border-radius: var(--cp-radius-lg); border: 2px dashed color-mix(in srgb, var(--cp-primary) 50%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--cp-space-sm); font-size: 14px; font-weight: 700;">
      <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>
      [Exercise picture]
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 20px var(--cp-space-lg); display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span class="label label--primary">Push · Reps</span>
      <h1 class="title">Push-up</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--cp-space-md);">
      <div style="border-radius: var(--cp-radius-md); background: var(--cp-surface); padding: var(--cp-space-md) 14px; display: flex; flex-direction: column; gap: var(--cp-space-xs);"><span class="label">Muscles</span><span style="font-size: 15px; line-height: 21px; font-weight: 700;">Chest, triceps, shoulders</span></div>
      <div style="border-radius: var(--cp-radius-md); background: var(--cp-surface); padding: var(--cp-space-md) 14px; display: flex; flex-direction: column; gap: var(--cp-space-xs);"><span class="label">Equipment</span><span style="font-size: 15px; line-height: 21px; font-weight: 700;">None</span></div>
    </div>

    <section id="how-to" style="display: flex; flex-direction: column; gap: 10px;">
      <h2 class="headline">How to do it</h2>
      <ol style="display: flex; flex-direction: column; gap: 10px;">
        <li style="display: flex; gap: var(--cp-space-md); align-items: flex-start;"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: var(--cp-radius-pill); background: var(--cp-primary); color: var(--cp-on-primary); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: none;">1</span><span>Hands under your shoulders, body straight from head to heels.</span></li>
        <li style="display: flex; gap: var(--cp-space-md); align-items: flex-start;"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: var(--cp-radius-pill); background: var(--cp-primary); color: var(--cp-on-primary); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: none;">2</span><span>Lower your chest to just above the floor, elbows at about 45 degrees.</span></li>
        <li style="display: flex; gap: var(--cp-space-md); align-items: flex-start;"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: var(--cp-radius-pill); background: var(--cp-primary); color: var(--cp-on-primary); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: none;">3</span><span>Push back up.</span></li>
      </ol>
    </section>
  </div>

  <div style="padding: var(--cp-space-md) 20px 28px; border-top: 1px solid var(--cp-outline);">
    <a class="primary-button primary-button--large" data-component="primary-button" href="../../agreed/phone/builder-sets-superset.html" style="height: 56px; font-size: 17px;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Add to a workout</a>
  </div>
</main>
</body>
</html>
