<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · appearance and units</title>
<meta name="mockup:screen" content="settings-preferences">
<meta name="mockup:section" content="Profile and settings">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">

  <header class="page-bar"><a class="icon-button" href="settings-general.html" aria-label="Back to settings"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><div><h1>Appearance and units</h1></div></header>
  <div class="settings-body" style="padding-top: var(--cp-space-lg);">
    <span class="label label-row">Appearance</span>
    <div class="setting-card" id="theme" data-component="setting-card"><strong>Theme</strong><div class="pill-group" role="radiogroup" aria-label="Theme"><button type="button" role="radio" aria-checked="true">System</button><button type="button" role="radio" aria-checked="false">Light</button><button type="button" role="radio" aria-checked="false">Dark</button></div><span class="hint-text">System follows your phone’s light or dark mode.</span></div>
    <span class="label label-row">Region</span>
    <div class="setting-card" id="language" data-component="setting-card"><strong>Language</strong><div class="pill-group" role="radiogroup" aria-label="Language"><button type="button" role="radio" aria-checked="true">System</button><button type="button" role="radio" aria-checked="false">English</button><button type="button" role="radio" aria-checked="false">Français</button></div></div>
    <div class="setting-card" id="units" data-component="setting-card"><strong>Units</strong><div class="pill-group" role="radiogroup" aria-label="Units"><button type="button" role="radio" aria-checked="true">Metric</button><button type="button" role="radio" aria-checked="false">Imperial</button></div><span class="hint-text">Metric: km, km/h, kg, cm. Imperial: mi, mph, lb, ft and in. Weight and height you logged are converted, never changed.</span></div>
  </div>
</main>
</body>
</html>
