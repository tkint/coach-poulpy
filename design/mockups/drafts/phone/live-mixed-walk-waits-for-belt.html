<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live · walk step waits for the belt</title>
<meta name="mockup:screen" content="live-mixed-walk-waits-for-belt">
<meta name="mockup:section" content="Live">
<meta name="mockup:issue" content="82">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone player">
  <div class="session-progress" id="session-progress">
    <button class="icon-button icon-button--filled" type="button" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    <div>
      <span class="label numbers">Step 5 of 6 · 31:05</span>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="4" aria-label="Session progress"><div style="width: 66%;"></div></div>
    </div>
    <a class="icon-button icon-button--filled" href="#" aria-label="End session"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>
  <section class="treadmill-strip" id="treadmill-strip" aria-label="Treadmill" data-component="treadmill-strip">
    <div><span class="label">Speed</span><span class="value">0.0 <small>km/h</small></span></div>
    <div><span class="label">Distance</span><span class="value">2.00 <small>km</small></span></div>
    <div><span class="label">Heart rate</span><span class="value">104 <small>bpm</small></span></div>
  </section>

  <div class="player-step" id="current-step">
    <img src="../../../poulpy/pose_straining.svg" alt="Poulpy waiting">
    <span class="part-line" id="part-line" data-component="part-line">Cool-down</span>
    <h1 class="title">Walk</h1>
    <div class="waiting-row" role="status">
      <span><strong>Start your treadmill</strong><small>The step starts with the belt</small></span>
    </div>
    <span class="target-value">10</span>
    <span class="target-unit">min</span>
  </div>
  <div class="player-actions">
    <button class="secondary-button secondary-button--large" data-component="secondary-button" type="button">Skip</button>
    <a class="primary-button primary-button--large" data-component="primary-button" href="#">Start now</a>
  </div>
</main>
</body>
</html>
