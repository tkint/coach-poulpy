<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · rest between sets</title>
<meta name="mockup:screen" content="player-rest">
<meta name="mockup:section" content="Guided player">
<meta name="mockup:issue" content="104">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/ui/src/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone player">
  <div class="session-progress" id="session-progress">
    <button class="icon-button icon-button--filled" type="button" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="pause"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg></button>
    <div>
      <span class="label numbers">Step 4 of 18 · 06:40</span>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="18" aria-valuenow="4" aria-label="Session progress"><div style="width: 22%;"></div></div>
    </div>
    <a class="icon-button icon-button--filled" href="home-planned.html" aria-label="End session"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
  </div>

  <div class="player-step" id="current-step" style="gap: 14px;">
    <h1 class="title" style="color: var(--cp-primary);">Rest</h1>
    <div class="rest-timer" id="rest-timer" data-component="rest-timer">
      <svg viewBox="0 0 200 200" width="260" height="260" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="12"/>
        <circle class="left" cx="100" cy="100" r="88" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="111"/>
      </svg>
      <div>
        <img src="../../../poulpy/pose_side_glance.svg" alt="Poulpy glancing to the side, catching his breath">
        <span role="timer" aria-label="1 minute 12 seconds left">01:12</span>
      </div>
    </div>
    <div class="adjust-buttons">
      <button type="button">−15 s</button>
      <button type="button">+15 s</button>
    </div>
  </div>

  <div class="next-card next-card--stacked" id="next-step" data-component="next-card">
    <span class="label">Next up</span>
    <span class="headline">Goblet squat · set 3 of 4</span>
    <span class="muted numbers" style="font-weight: 500;">8 reps at 16 kg</span>
  </div>

  <a class="tonal-button tonal-button--large" data-component="tonal-button" href="player-set.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="skip-forward"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg>Skip rest</a>
</main>
</body>
</html>
