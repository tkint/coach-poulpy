<main class="phone">
<header class="top-bar">
    <button type="button" class="icon-button" aria-label="Back to the library"><MobileIcon name="chevron-left" /></button>
    <button class="icon-button" type="button" aria-label="More options" aria-haspopup="menu"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
  </header>

  <div class="page-body">
    <div id="workout-summary" style="display: flex; flex-direction: column; gap: 2px;">
      <span class="label label--primary">Strength</span>
      <h1 class="title" style="font-size: 30px; line-height: 34px;">Upper body</h1>
      <p class="workout-details">4 exercises · about 32 min · dumbbells, mat</p>
    </div>

    <section id="planned-days" data-component="planned-days" aria-label="Planned days" style="border-radius: var(--cp-radius-md); background: var(--cp-primary-container); color: var(--cp-on-primary-container); padding: var(--cp-space-sm) var(--cp-space-sm) 10px var(--cp-space-md); display: flex; flex-direction: column; gap: var(--cp-space-sm);">
      <div style="display: flex; align-items: center; gap: 10px;">
        <MobileIcon name="calendar" :size="22" />
        <span style="flex: 1; font-size: 15px; line-height: 20px; font-weight: 800;">Planned on 3 days</span>
        <button type="button" style="min-height: 40px; padding: 0 var(--cp-space-md); border-radius: var(--cp-radius-pill); background: var(--cp-surface); font-size: 14px; font-weight: 800; display: flex; align-items: center;">Change days</button>
      </div>
      <ul style="display: flex; flex-wrap: wrap; gap: 6px;">
        <li style="height: 32px; padding: 0 var(--cp-space-md); border-radius: var(--cp-radius-pill); background: var(--cp-surface); color: var(--cp-on-surface); font-size: 14px; font-weight: 800; display: flex; align-items: center; font-variant-numeric: tabular-nums;">Tue 27 Oct</li>
        <li style="height: 32px; padding: 0 var(--cp-space-md); border-radius: var(--cp-radius-pill); background: var(--cp-surface); color: var(--cp-on-surface); font-size: 14px; font-weight: 800; display: flex; align-items: center; font-variant-numeric: tabular-nums;">Fri 30 Oct</li>
        <li style="height: 32px; padding: 0 var(--cp-space-md); border-radius: var(--cp-radius-pill); background: var(--cp-surface); color: var(--cp-on-surface); font-size: 14px; font-weight: 800; display: flex; align-items: center; font-variant-numeric: tabular-nums;">Tue 3 Nov</li>
      </ul>
    </section>

    <div class="stat-tiles">
      <MobileStatTile label="Done" value="3 times" />
      <MobileStatTile label="Last time" value="Wed 21" />
      <MobileStatTile label="Usually" value="31 min" />
    </div>

    <span class="label" style="margin: var(--cp-space-xs) var(--cp-space-xs) 0;">Exercises</span>
    <ol class="steps">
      <li>
        <button type="button" class="step-row" data-component="step-row">
          <span class="step-number" aria-hidden="true">1</span>
          <span class="step-text"><strong>Push-up</strong><span>3 × 12 · rest 60 s</span></span>
          <MobileIcon name="chevron-right" :size="20" />
        </button>
      </li>
      <li>
        <button type="button" class="step-row" data-component="step-row">
          <span class="step-number" aria-hidden="true">2</span>
          <span class="step-text"><strong>One-arm dumbbell row</strong><span>3 × 10 each side · 14 kg · rest 60 s</span></span>
          <MobileIcon name="chevron-right" :size="20" />
        </button>
      </li>
      <li>
        <button type="button" class="step-row" data-component="step-row">
          <span class="step-number" aria-hidden="true">3</span>
          <span class="step-text"><strong>Dumbbell overhead press</strong><span>3 × 8 · 10 kg · rest 90 s</span></span>
          <MobileIcon name="chevron-right" :size="20" />
        </button>
      </li>
      <li>
        <button type="button" class="step-row" data-component="step-row">
          <span class="step-number" aria-hidden="true">4</span>
          <span class="step-text"><strong>Plank</strong><span>3 × 40 s hold · rest 45 s</span></span>
          <MobileIcon name="chevron-right" :size="20" />
        </button>
      </li>
    </ol>
  </div>

  <div class="action-bar">
    <MobileButton kind="secondary" icon="pencil" :icon-size="18" style="flex: 1; font-size: 16px;">Edit</MobileButton>
    <MobileButton icon="play" :icon-size="18" style="flex: 1.6;">Start now</MobileButton>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <section class="sheet plan-sheet" id="plan-sheet" role="dialog" aria-modal="true" aria-labelledby="plan-title" data-component="sheet" style="gap: var(--cp-space-md);">
    <span class="sheet-handle" aria-hidden="true"></span>
    <div class="sheet-title"><h2 id="plan-title">Plan Upper body</h2><p>Tap the days to train it. Tap again to take one off.</p></div>
    <div class="month-nav"><button class="icon-button icon-button--quiet" type="button" aria-label="Previous month"><MobileIcon name="chevron-left" :size="20" /></button><span>October 2026</span><button class="icon-button icon-button--quiet" type="button" aria-label="Next month"><MobileIcon name="chevron-right" :size="20" /></button></div>
    <div>
      <div class="weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="days" role="grid">
        <div></div>
        <div></div>
        <div></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Thu 1 October">1</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Fri 2 October">2</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Sat 3 October">3</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Sun 4 October">4</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Mon 5 October">5</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Tue 6 October">6</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Wed 7 October">7</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Thu 8 October">8</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Fri 9 October">9</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Sat 10 October">10</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Sun 11 October">11</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Mon 12 October">12</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Tue 13 October">13</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Wed 14 October">14</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Thu 15 October">15</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Fri 16 October">16</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Sat 17 October">17</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Sun 18 October">18</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Mon 19 October">19</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Tue 20 October">20</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Wed 21 October">21</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Thu 22 October">22</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Fri 23 October">23</button></div>
        <div><button class="day day--past" type="button" role="gridcell" aria-pressed="false" aria-label="Sat 24 October">24</button></div>
        <div><button class="day day--today" type="button" role="gridcell" aria-pressed="false" aria-label="Sun 25 October">25</button></div>
        <div><button class="day" type="button" role="gridcell" aria-pressed="false" aria-label="Mon 26 October">26</button></div>
        <div><button class="day day--active" type="button" role="gridcell" aria-pressed="true" aria-label="Tue 27 October, planned">27</button></div>
        <div><button class="day" type="button" role="gridcell" aria-pressed="false" aria-label="Wed 28 October">28</button></div>
        <div><button class="day" type="button" role="gridcell" aria-pressed="false" aria-label="Thu 29 October">29</button></div>
        <div><button class="day day--active" type="button" role="gridcell" aria-pressed="true" aria-label="Fri 30 October, planned">30</button></div>
        <div><button class="day" type="button" role="gridcell" aria-pressed="false" aria-label="Sat 31 October">31</button></div>
      </div>
    </div>
    <MobileButton style="height: 52px;">Save 3 days</MobileButton>
  </section>
</main>
