<main class="phone">

  <MobileTopBar title="Your profile" leading="back" back-label="Back to profile" />
  <div class="scrim"></div>
  <MobileSheet id="sex-sheet" aria-label="Sex assigned at birth">
    <span class="sheet-handle"></span>
    <div class="sheet-title"><h2>Sex assigned at birth</h2><p>Why we ask: calorie and heart rate estimates differ a little with it. It is never shown to anyone, and you can leave it out.</p></div>
    <div class="option-list" role="radiogroup" aria-label="Sex assigned at birth">
      <MobileOptionRow control="radio" name="sex">Female</MobileOptionRow>
      <MobileOptionRow control="radio" name="sex">Male</MobileOptionRow>
      <MobileOptionRow control="radio" name="sex">Intersex</MobileOptionRow>
      <MobileOptionRow control="radio" name="sex" checked>Prefer not to say</MobileOptionRow>
    </div>
    <span class="field-note">This is not about your gender, and Poulpy never asks about it. Your pronouns are set separately.</span>
    <div class="sheet-actions"><MobileButton size="xl">Save</MobileButton></div>
  </MobileSheet>
</main>
