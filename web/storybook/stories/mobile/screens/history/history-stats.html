<main class="phone">
  <div class="history-head">
    <h1>History</h1>
    <div class="view-tabs" role="tablist" aria-label="History view" id="view-tabs">
      <button type="button" role="tab" aria-selected="false"><MobileIcon name="calendar" :size="18" />Calendar</button>
      <button type="button" role="tab" aria-selected="true"><MobileIcon name="chart-no-axes-column" :size="18" />Stats</button>
    </div>
  </div>
  <div class="stats-body">
    <div class="stat-pair">
      <section class="stat-card stat-card--highlight" id="this-week"><span class="label" style="color: inherit;">This week</span><span class="big">3 sessions</span><span class="line">112 min · 4.2 km</span></section>
      <section class="stat-card" id="this-month"><span class="label label--primary">This month</span><span class="big">11 sessions</span><span class="line muted">386 min · 14.8 km</span></section>
    </div>
    <section class="charts" id="weekly-charts">
      <div class="chart"><span class="label">Active minutes per week</span>
        <div class="bars" role="img" aria-label="Active minutes per week. 31/8: 45, 7/9: 60, 14/9: 0, 21/9: 90, 28/9: 75, 5/10: 120, 12/10: 80, 19/10: 112" style="height: 104px;"><div><span>45</span><i style="height: 28px;"></i></div><div><span>60</span><i style="height: 38px;"></i></div><div><span></span><i style="height: 2px;"></i></div><div><span>90</span><i style="height: 57px;"></i></div><div><span>75</span><i style="height: 48px;"></i></div><div><span>120</span><i style="height: 76px;"></i></div><div><span>80</span><i style="height: 51px;"></i></div><div class="now"><span>112</span><i style="height: 71px;"></i></div></div></div>
      <div class="chart chart--km"><span class="label">Treadmill km per week</span>
        <div class="bars" role="img" aria-label="Treadmill km per week. 31/8: 2.1, 7/9: 3.4, 14/9: 0.0, 21/9: 4.0, 28/9: 2.8, 5/10: 5.2, 12/10: 3.9, 19/10: 4.2" style="height: 84px;"><div><span>2.1</span><i style="height: 23px;"></i></div><div><span>3.4</span><i style="height: 37px;"></i></div><div><span></span><i style="height: 2px;"></i></div><div><span>4.0</span><i style="height: 43px;"></i></div><div><span>2.8</span><i style="height: 30px;"></i></div><div><span>5.2</span><i style="height: 56px;"></i></div><div><span>3.9</span><i style="height: 42px;"></i></div><div class="now"><span>4.2</span><i style="height: 45px;"></i></div></div>
        <div class="week-names" aria-hidden="true"><span>31/8</span><span>7/9</span><span>14/9</span><span>21/9</span><span>28/9</span><span>5/10</span><span>12/10</span><span>19/10</span></div></div>
    </section>
    <div class="stat-trio" id="records">
      <section class="stat-card"><span class="name">Total</span><span class="value">64</span><span class="note">sessions</span></section>
      <section class="stat-card"><span class="name">Longest run</span><span class="value">5.2 km</span><span class="note">8 Oct</span></section>
      <section class="stat-card"><span class="name">Full octopus</span><span class="value">×1</span><span class="note">8 of 8 lit</span></section>
    </div>
  </div>
  <MobileNavBar active="history" />
</main>
