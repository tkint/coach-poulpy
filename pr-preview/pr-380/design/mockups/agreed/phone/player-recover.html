<!doctype html>
<html lang="en">
<head>

<body>
<main class="phone player">
  <div class="session-progress" id="session-progress">
    <button class="icon-button icon-button--filled" type="button" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="pause"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg></button>
    <div>
      <span class="label numbers">Step 10 of 25 · 07:05</span>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="25" aria-valuenow="10" aria-label="Session progress"><div style="width: 40%;"></div></div>
    </div>
    <a class="icon-button icon-button--filled" href="#" aria-label="End session"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
  </div>

  <div class="player-step" id="current-step" style="gap: 14px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <span class="part-line" id="part-line" data-component="part-line"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="zap"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></svg>Work 1 · round 2 of 4</span>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="role-tag" data-component="role-tag" style="align-self: center;">Recover</span>
        <h1 class="title" style="color: var(--cp-primary);">Rest</h1>
      </div>
    </div>
    <div class="rest-timer" id="rest-timer" data-component="rest-timer">
      <svg viewBox="0 0 200 200" width="260" height="260" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="12"/>
        <circle class="left" cx="100" cy="100" r="88" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="166"/>
      </svg>
      <div>
        <img src="../../../poulpy/pose_side_glance.svg" alt="Poulpy glancing to the side, catching his breath">
        <span role="timer" aria-label="42 seconds left">00:42</span>
      </div>
    </div>
    <div class="adjust-buttons">
      <button type="button">−15 s</button>
      <button type="button">+15 s</button>
    </div>
  </div>

  <div class="next-card next-card--stacked" id="next-step" data-component="next-card">
    <span class="label">Next up · round 3 of 4</span>
    <span class="headline">Goblet squat</span>
    <span class="muted numbers" style="font-weight: 500;">15 reps at 16 kg</span>
  </div>

  <a class="tonal-button tonal-button--large" data-component="tonal-button" href="player-circuit-round.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="skip-forward"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg>Skip rest</a>
