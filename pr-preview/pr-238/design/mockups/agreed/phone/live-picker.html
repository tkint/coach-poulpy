<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live · what are you doing?</title>
<meta name="mockup:screen" content="live-picker">
<meta name="mockup:section" content="Live">
<meta name="mockup:issue" content="104">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">
  <div class="scrim" aria-hidden="true"></div>
  <section class="sheet sheet--tall" id="activity-sheet" role="dialog" aria-label="What are you doing?" data-component="sheet">
    <span class="sheet-handle" aria-hidden="true"></span>
    <div class="sheet-head"><h2>What are you doing?</h2><a class="icon-button" href="live-ready.html" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>
    <div class="radio-list" role="radiogroup" aria-label="What are you doing?">
      <span class="label">Walking</span>
      <button class="radio-row" type="button" role="radio" aria-checked="false"><span><strong>Walk with support</strong><small>Hands on the rails, small steps</small></span><span class="radio" aria-hidden="true"></span></button>
      <button class="radio-row" type="button" role="radio" aria-checked="false"><span><strong>Gentle walk</strong><small>Slow and short, at your own pace</small></span><span class="radio" aria-hidden="true"></span></button>
      <button class="radio-row" type="button" role="radio" aria-checked="true"><span><strong>Walk</strong><small>Your everyday pace</small></span><span class="radio" aria-hidden="true"></span></button>
      <button class="radio-row" type="button" role="radio" aria-checked="false"><span><strong>Brisk walk</strong><small>You can talk but not sing</small></span><span class="radio" aria-hidden="true"></span></button>
      <span class="label">Running</span>
      <button class="radio-row" type="button" role="radio" aria-checked="false"><span><strong>Easy run</strong><small>Relaxed, you could chat</small></span><span class="radio" aria-hidden="true"></span></button>
      <button class="radio-row" type="button" role="radio" aria-checked="false"><span><strong>Run</strong><small>Steady and comfortable</small></span><span class="radio" aria-hidden="true"></span></button>
      <span class="label">Follow a workout</span>
      <button class="radio-row" type="button" role="radio" aria-checked="false"><span><strong>Demo intervals</strong><small>3 min warm-up, 3 × 1 min fast / 1 min easy</small></span><span class="radio" aria-hidden="true"></span></button>
      <button class="radio-row" type="button" role="radio" aria-checked="false"><span><strong>Saturday 5K</strong><small>Your workout · 5 km at 6:00 /km</small></span><span class="radio" aria-hidden="true"></span></button>
    </div>
  </section>
</main>
</body>
</html>
