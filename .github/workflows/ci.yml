name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Release workflow runs all of this first and publishes only if it passes.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    name: Shared tests, server and Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Check the catalog version is raised with the catalog
        # Fink's pull requests change catalog text but never raise its version (ADR 0015), and phones
        # only take a catalog whose version is higher than the one they have.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --quiet FETCH_HEAD -- 'i18n/messages/*/catalog.json' catalog/data/exercises.json; then exit 0; fi
          before=$(git show FETCH_HEAD:catalog/data/exercises.json | jq .version)
          after=$(jq .version catalog/data/exercises.json)
          if [ "$after" -le "$before" ]; then
            echo "::error file=catalog/data/exercises.json::The catalog changed but its version is still $after. Raise \"version\" to $((before + 1)) before merging."
            exit 1
          fi
      - name: Test shared modules, server and the string generator
        run: ./gradlew jvmTest jsTest :server:test :tools:i18n:test
      - name: Unpack the signing key
        # Every build is signed with the same key, so a new APK installs over the old one.
        # Pull requests from forks get no secrets and fall back to a throwaway debug key.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this APK is signed with a throwaway key and will not install over earlier builds."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/poulpy.jks"
          echo "POULPY_KEYSTORE_FILE=$RUNNER_TEMP/poulpy.jks" >> "$GITHUB_ENV"
      - name: Number the build
        # Minutes since 2026-01-01, so a build made later always has a higher version than one made
        # earlier, even across branches; Android refuses to install a lower version over a higher one.
        run: |
          code=$(( ($(date +%s) - 1767225600) / 60 ))
          echo "POULPY_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Android version code: **$code**" >> "$GITHUB_STEP_SUMMARY"
      - name: Build Android APK
        env:
          POULPY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app-android:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: coach-poulpy-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk

  ios:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd app-ios && xcodegen
      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project app-ios/CoachPoulpy.xcodeproj \
            -scheme CoachPoulpy \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  server-image:
    name: Server image and deploy files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the server image
        run: docker build -f server/Dockerfile -t coach-poulpy-server:ci .
      - name: Start it beside a Postgres and wait for its health check
        run: |
          docker network create ci
          docker run -d --name postgres --network ci -e POSTGRES_DB=coachpoulpy \
            -e POSTGRES_USER=coachpoulpy -e POSTGRES_PASSWORD=ci postgres:17
          docker run -d --name server --network ci \
            -e DATABASE_URL=jdbc:postgresql://postgres:5432/coachpoulpy \
            -e DATABASE_USER=coachpoulpy -e DATABASE_PASSWORD=ci \
            --restart on-failure coach-poulpy-server:ci
          for _ in $(seq 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' server)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs server
          echo "::error::The server did not become healthy"; exit 1
      - name: Check the deploy files (docs/deploying-the-server.md)
        run: |
          POSTGRES_PASSWORD=ci docker compose -f deploy/compose.yaml config -q
          docker compose -f deploy/caddy/compose.yaml config -q
          docker run --rm -e DOMAIN=api.example.com -e APP_NAME=coach-poulpy -v "$PWD/deploy/coach-poulpy.caddy:/etc/caddy/site.caddy:ro" \
            caddy:2 caddy validate --config /etc/caddy/site.caddy --adapter caddyfile
      - name: Build the web image and check its deploy files
        run: |
          docker build -f web/Dockerfile --build-arg ANDROID_CERT_SHA256=00:11 -t coach-poulpy-web:ci .
          docker run -d --name web -p 8081:8080 coach-poulpy-web:ci
          for _ in $(seq 15); do curl -fsS -o /dev/null http://localhost:8081/ && break; sleep 1; done
          curl -fsS http://localhost:8081/confirm-email | grep -q '<div id="app"' || { echo "::error::/confirm-email isn't the app"; exit 1; }
          curl -fsSI http://localhost:8081/.well-known/assetlinks.json | grep -qi 'content-type: application/json' || { echo "::error::No assetlinks.json"; exit 1; }
          docker compose -f deploy/web/compose.yaml config -q
          docker run --rm -e DOMAIN=app.example.com -e APP_NAME=coach-poulpy-web -v "$PWD/deploy/web/coach-poulpy-web.caddy:/etc/caddy/site.caddy:ro" \
            caddy:2 caddy validate --config /etc/caddy/site.caddy --adapter caddyfile

  web:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the generated theme files match design/tokens.json
        run: node ../design/build-tokens.mjs --check
      - name: Check the generated Poulpy drawings match design/build-poulpy.mjs
        run: node ../design/build-poulpy.mjs --check
      - name: Check the body map figures match design/build-body-map.mjs
        run: node ../design/build-body-map.mjs --check
      - name: Check the generated body map shapes match design/body-map.json
        run: node ../design/build-body-map-shapes.mjs --check
      - name: Check the HTML mockups use only the design tokens and link only files in the repo
        run: node ../design/check-mockups.mjs
      - run: npm ci
      - name: Check the web design system's CSS is current (ADR 0023), then build the web app
        run: npm run build
