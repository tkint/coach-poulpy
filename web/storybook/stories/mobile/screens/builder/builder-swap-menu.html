<main class="phone" style="--frame-height: 900px">
<MobileTopBar title="New workout" leading="close"><MobileButton size="sm">Save</MobileButton></MobileTopBar>

  <div class="page-body builder-body">
    <label class="field">
      <span class="label">Name</span>
      <input class="text-field" type="text" value="Easy run and 400 m">
    </label>
    <div class="format-line" id="format" data-component="format-line">
      <span class="label">Format</span>
      <button type="button" class="format-control" data-component="format-control" aria-haspopup="dialog" aria-label="Format: Circuit. Change it"><span class="format-pill"><MobileIcon name="repeat" :size="18" /><strong>Circuit</strong><MobileIcon name="chevron-down" :size="16" /></span></button>
    </div>
    <fieldset class="recap-part builder-block" id="warm-up" data-component="recap-part" aria-label="Warm-up">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon" aria-hidden="true"><MobileIcon name="sun" :size="20" /></span><div><h2>Warm-up</h2><p>1 exercise · about 12 min</p></div></div></legend>
          <ol class="steps" data-reorder><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="footprints" :size="18" /></span><span class="row-text"><strong>Run</strong><span>2 km · 6:00 /km</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Run"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li></ol>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to warm-up"><MobileIcon name="plus" :size="16" /></button>
        </fieldset>
    <fieldset class="recap-part builder-block" id="work" data-component="recap-part" aria-label="Work">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon part-icon--work" aria-hidden="true"><MobileIcon name="zap" :size="20" /></span><div><h2>Work</h2><p>1 exercise · about 20 min</p></div></div></legend>
          <ol class="steps" data-reorder><li><section class="repeat" data-component="repeat" aria-label="Repeat 6 times">
              <div class="repeat-header"><MobileIcon name="repeat" :size="18" /><button type="button" class="repeat-title" aria-haspopup="dialog"><strong>Repeat 6 times</strong></button>
                <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for this repeat"><MobileIcon name="ellipsis-vertical" :size="20" /></button></div>
              <ol class="steps"><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="footprints" :size="18" /></span><span class="row-text"><strong>Run</strong><span>400 m · 4:30 /km</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Run"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="footprints" :size="18" /></span><span class="row-text"><span class="row-title"><strong>Walk</strong><MobileRoleTag>Recover</MobileRoleTag></span><span>1 min 30 s</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Walk"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li></ol>
            </section></li></ol>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to Work"><MobileIcon name="plus" :size="16" /></button>
        </fieldset>
    <fieldset class="recap-part builder-block" id="cool-down" data-component="recap-part" aria-label="Cool down">
          <legend class="part-header" data-component="part-header"><div class="part-title"><span class="part-icon" aria-hidden="true"><MobileIcon name="moon" :size="20" /></span><div><h2>Cool down</h2><p>1 exercise · until the end</p></div></div></legend>
          <ol class="steps" data-reorder><li><div class="list-row recap-row builder-row" data-component="builder-row">
              <button type="button" class="row-main"><span class="row-icon" aria-hidden="true"><MobileIcon name="footprints" :size="18" /></span><span class="row-text"><strong>Walk</strong><span>until the end</span></span></button>
              <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Walk"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
            </div></li></ol>
          <button class="part-add" type="button" data-component="part-add" aria-label="Add to cool down"><MobileIcon name="plus" :size="16" /></button>
        </fieldset>
  </div>
  <div class="scrim" aria-hidden="true" style="background: transparent;"></div>
  <div class="popover-menu" id="step-menu" role="menu" aria-label="Actions for Run" data-component="popover-menu" style="position: absolute; top: 500px; right: 28px; width: 268px;">
    <button type="button" role="menuitem"><MobileIcon name="pencil" :size="22" />Edit</button>
    <button type="button" role="menuitem"><MobileIcon name="arrow-left-right" :size="22" />Swap exercise</button>
    <button type="button" role="menuitem"><MobileIcon name="copy" :size="22" />Duplicate</button>
    <button type="button" role="menuitem"><MobileIcon name="arrow-up" :size="22" />Move up</button>
    <button type="button" role="menuitem"><MobileIcon name="arrow-down" :size="22" />Move down</button>
    <button type="button" role="menuitem"><MobileIcon name="list-indent-decrease" :size="22" />Move out of the repeat</button>
    <hr>
    <button type="button" class="danger" role="menuitem"><MobileIcon name="trash" :size="22" />Delete</button>
  </div>
</main>
