<main class="phone player" style="padding-top: 64px; gap: 20px;">
  <div class="player-step" id="summary" style="gap: 6px;">
    <img src="../../../poulpy/pose_patched_up.svg" alt="Poulpy patched up, resting" style="width: 230px; height: 207px; margin-bottom: var(--cp-space-xs);">
    <h1 style="font: var(--cp-type-display);">Well done!</h1>
    <p class="headline" style="font-weight: 600; font-size: 19px; line-height: 23px; color: var(--cp-primary);">“Listening to your body is training too.”</p>
    <p class="muted" id="workout-name" style="margin-top: var(--cp-space-sm); font-weight: 800; color: var(--cp-on-surface);">Knee rehab</p>
    <p class="muted numbers" id="session-date">Sat 24 Oct · 18:05</p>
    <p class="muted numbers">2 of 3 sets done in 14:10</p>
  </div>

  <div class="stat-tiles" id="session-totals">
    <div class="stat-tile"><span class="label">Time</span><strong>14:10</strong></div>
    <div class="stat-tile"><span class="label">Sets</span><strong>2</strong></div>
  </div>

  <MobilePoulpyCard id="tentacle-lit" aria-label="Tentacle lit" title="Tentacle 4 lit!" compact>
    <template #art><MobileTentacleRing :lit="4" fresh :size="64" label="4 of 8 tentacles lit" /></template>
    A gentle session counts, and so does rest.
  </MobilePoulpyCard>

  <div style="display: flex; flex-direction: column; gap: var(--cp-space-sm);" id="finished-actions">
    <MobileButton large>Close</MobileButton>
  </div>
</main>
