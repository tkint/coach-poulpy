<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder · walk or run target</title>
<meta name="mockup:screen" content="builder-run-target">
<meta name="mockup:section" content="Builder">
<meta name="mockup:issue" content="104">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">
<header class="top-bar" style="padding: var(--cp-space-xxxl) var(--cp-space-md) var(--cp-space-sm); justify-content: flex-start; gap: var(--cp-space-xs);">
    <a class="icon-button" href="home-planned.html" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 class="headline" style="flex: 1;">New workout</h1>
    <a class="small-button" data-component="primary-button" href="#">Save</a>
  </header>

  <div class="form-body">
    <label class="field">
      <span class="label">Name</span>
      <input class="text-field" type="text" value="Saturday 5K">
    </label>
    <div class="field">
      <span class="label">Kind of workout</span>
      <div class="chip-row chip-row--wrap" role="group" aria-label="Kind of workout">
        <button class="filter-chip" data-component="filter-chip" type="button" aria-pressed="false">Strength</button>
        <button class="filter-chip" data-component="filter-chip" type="button" aria-pressed="false">Conditioning</button>
        <button class="filter-chip" data-component="filter-chip" type="button" aria-pressed="false">Mobility</button>
        <button class="filter-chip" data-component="filter-chip" type="button" aria-pressed="false">Rehab</button>
        <button class="filter-chip" data-component="filter-chip" type="button" aria-pressed="true">Treadmill</button>
      </div>
    </div>

    <section class="builder-step" data-component="builder-step" aria-label="Walk">
      <div class="builder-step-header">
        <span class="drag-handle" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
        <span class="row-text"><strong>Walk</strong><span>5 min · warm-up</span></span>
        <button class="icon-button" type="button" aria-label="Edit Walk" style="color: var(--cp-on-surface-variant);"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </section>

    <section class="builder-step builder-step--open" id="step-2" data-component="builder-step" aria-label="Run">
      <div class="builder-step-header">
        <span class="drag-handle" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
        <span class="row-text"><strong>Run</strong></span>
        <button class="icon-button" type="button" aria-label="Remove Run" style="color: var(--cp-on-surface-variant);"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
      <div class="field" style="padding-right: var(--cp-space-xs);">
        <span class="label">Target</span>
        <div role="radiogroup" aria-label="Target" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--cp-space-sm);">
          <button class="filter-chip filter-chip--small" data-component="filter-chip" type="button" role="radio" aria-checked="false">Duration</button>
          <button class="filter-chip filter-chip--small" data-component="filter-chip" type="button" role="radio" aria-checked="false">Distance</button>
          <button class="filter-chip filter-chip--small" data-component="filter-chip" type="button" role="radio" aria-checked="false">Duration + pace</button>
          <button class="filter-chip filter-chip--small" data-component="filter-chip" type="button" role="radio" aria-checked="true">Distance + pace</button>
        </div>
      </div>
      <div class="steppers">
        <div class="stepper" data-component="stepper">
          <span class="label">Distance</span>
          <div><button type="button" aria-label="Shorter">−</button><a class="value-link" href="builder-distance-sheet.html" aria-label="Set distance, 5.0 km">5.0 km</a><button type="button" aria-label="Longer">+</button></div>
        </div>
        <div class="stepper" data-component="stepper">
          <span class="label">Pace</span>
          <div><button type="button" aria-label="Slower pace">−</button><a class="value-link" href="#" aria-label="Set pace, 6:00 per km">6:00 /km</a><button type="button" aria-label="Faster pace">+</button></div>
        </div>
      </div>
      <span style="font-size: 13.5px; line-height: 18px; color: var(--cp-on-surface-variant); padding-right: var(--cp-space-xs);">≈ 10.0 km/h · about 30 min · tap a value to type it</span>
    </section>

    <section class="builder-step" data-component="builder-step" aria-label="Walk">
      <div class="builder-step-header">
        <span class="drag-handle" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
        <span class="row-text"><strong>Walk</strong><span>5 min · cool-down</span></span>
        <button class="icon-button" type="button" aria-label="Edit Walk" style="color: var(--cp-on-surface-variant);"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </section>

    <a class="add-button" data-component="add-step-button" href="library-exercises.html"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Add an exercise</a>
  </div>
</main>
</body>
</html>
