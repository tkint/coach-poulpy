name: Release

# Pushing a tag such as v0.6.0 is the release (docs/releasing.md): the tag is the version. The run
# checks the tag and the signing key, runs the whole of ci.yml, then publishes the server image on
# the GitHub Container Registry and a GitHub release with the signed Android APK and the server's
# deploy bundle attached. A failing step publishes nothing. Deploying the server is a separate step,
# the Deploy workflow (ADR 0019).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/coach-poulpy-server

jobs:
  version:
    name: Check the tag and the signing key
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - name: Read the version from the tag
        id: read
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The tag must look like v0.6.0, not '$TAG'. Delete it (git push origin :refs/tags/$TAG) and push a correct one."
            exit 1
          fi
          version=${TAG#v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Pre-release while the major is 0, a normal release from 1.0.
          if [ "${version%%.*}" = 0 ]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
      - name: Refuse a release the phones could not install over
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. A release must be signed with the key phones already trust (README, \"The signing key\")."
            exit 1
          fi

  test:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  server-image:
    name: Publish the server image
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          # The machine is amd64 (ADR 0019); arm64 under emulation would multiply the build time.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Publish the APK and the deploy bundle
    # After the image, so a release only exists once its server image does.
    needs: [version, server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ needs.version.outputs.tag }}
      POULPY_VERSION_NAME: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/poulpy.jks"
          echo "POULPY_KEYSTORE_FILE=$RUNNER_TEMP/poulpy.jks" >> "$GITHUB_ENV"
          # Same numbering as ci.yml: minutes since 2026-01-01, so a release installs over any earlier build.
          echo "POULPY_VERSION_CODE=$(( ($(date +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"
      - name: Build the APK
        # Debug build type, as ci.yml: it is the one that has been run on phones.
        env:
          POULPY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app-android:assembleDebug
      - name: Bundle the server's deploy files
        # Unpacked into ~/coach-poulpy on the machine (docs/deploying-the-server.md). IMAGE_TAG in
        # .env.example stays "latest", so `docker compose pull` follows new releases.
        run: |
          mkdir -p dist/coach-poulpy
          cp -r deploy/compose.yaml deploy/.env.example deploy/coach-poulpy.caddy deploy/edge dist/coach-poulpy/
          tar -C dist -czf coach-poulpy-deploy.tar.gz coach-poulpy
      - name: Publish the release
        # Notes list the pull requests merged since the last release, as GitHub generates them. A
        # release already drafted or published from the Releases page is completed instead: assets
        # added, title and pre-release flag set, and notes filled in only if it has none.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-android/build/outputs/apk/debug/*.apk "coach-poulpy-${VERSION_TAG}.apk"
          assets=("coach-poulpy-${VERSION_TAG}.apk" coach-poulpy-deploy.tar.gz)
          title="Coach Poulpy ${VERSION_TAG}"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$VERSION_TAG" --jq .body > notes.md
          if gh release view "$VERSION_TAG" > /dev/null 2>&1; then
            gh release upload "$VERSION_TAG" "${assets[@]}" --clobber
            if [ -z "$(gh release view "$VERSION_TAG" --json body --jq '.body | gsub("\\s"; "")')" ]; then
              gh release edit "$VERSION_TAG" --title "$title" --prerelease="$PRERELEASE" --notes-file notes.md
            else
              gh release edit "$VERSION_TAG" --title "$title" --prerelease="$PRERELEASE"
            fi
          else
            gh release create "$VERSION_TAG" "${assets[@]}" --verify-tag --prerelease="$PRERELEASE" \
              --title "$title" --notes-file notes.md
          fi
