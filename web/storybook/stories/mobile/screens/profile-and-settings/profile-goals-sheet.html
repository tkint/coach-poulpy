<main class="phone">

  <header class="page-bar"><button type="button" class="icon-button" aria-label="Back to profile"><MobileIcon name="chevron-left" :size="22" /></button><div><h1>Your profile</h1></div></header>
  <div class="scrim"></div>
  <MobileSheet id="goals-sheet" aria-label="Goals">
    <span class="sheet-handle"></span>
    <div class="sheet-title"><h2>Goals</h2><p>Pick as many as you like. Poulpy suggests workouts for all of them.</p></div>
    <div class="option-list" role="group" aria-label="Goals"><MobileOptionRow control="checkbox" name="goals">Stay active</MobileOptionRow><MobileOptionRow control="checkbox" name="goals" checked>Build strength</MobileOptionRow><MobileOptionRow control="checkbox" name="goals" checked>Run further</MobileOptionRow><MobileOptionRow control="checkbox" name="goals">Rehab</MobileOptionRow><MobileOptionRow control="checkbox" name="goals">Something else</MobileOptionRow></div>
    <div class="sheet-actions"><button class="primary-button" type="button" style="flex: 1;">Save</button></div>
  </MobileSheet>
</main>
