<main class="phone">

  <MobileTopBar title="Weight" leading="back" back-label="Back to settings"><MobileButton size="sm">Log</MobileButton></MobileTopBar>
  <p class="app-bar-sub">Nothing logged yet</p>
  <div class="settings-body" style="padding-top: var(--cp-space-lg); gap: var(--cp-space-md);">
    <MobileEmptyState id="weight-empty" title="No weight yet">
      Log it once to see your chart. It stays on this phone, and only you see it.
      <template #action><MobileButton kind="secondary" size="sm" icon="plus">Log your weight</MobileButton></template>
    </MobileEmptyState>
  </div>
</main>
