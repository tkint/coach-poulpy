<main class="phone" style="--frame-height: 940px">
<header class="top-bar" style="padding: var(--cp-space-xxxl) var(--cp-space-md) var(--cp-space-sm); justify-content: flex-start; gap: var(--cp-space-xs);">
    <button type="button" class="icon-button" aria-label="Close"><MobileIcon name="x" :size="22" /></button>
    <h1 class="headline" style="flex: 1;">New workout</h1>
    <MobileButton size="sm">Save</MobileButton>
  </header>

  <div class="page-body">
    <label class="field">
      <span class="label">Name</span>
      <input class="text-field" type="text" value="Full body burner">
    </label>
    <div class="format-line" id="format" data-component="format-line">
      <span class="label">Format</span>
      <button type="button" class="format-control" data-component="format-control" aria-haspopup="dialog" aria-label="Format: Circuit. Change it"><MobileFormatChip icon="repeat">Circuit</MobileFormatChip><MobileIcon name="chevron-down" :size="16" /></button>
    </div>
    <section class="part" id="warm-up" data-component="part" aria-labelledby="warm-up-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon" aria-hidden="true"><MobileIcon name="sun" :size="20" /></span>
        <div><h2 id="warm-up-name">Warm-up</h2><p>2 steps · about 2 min</p></div>
        <button class="part-add" type="button" data-component="part-add" aria-label="Add to warm-up"><MobileIcon name="plus" :size="20" /></button>
        <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Warm-up"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
      </div>
      <ol class="steps" data-reorder>
        <li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Jumping jack"><span class="step-number" aria-hidden="true">1</span><span class="step-text"><strong>Jumping jack</strong><span>30 s</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Jumping jack"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li><li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Air squat"><span class="step-number" aria-hidden="true">2</span><span class="step-text"><strong>Air squat</strong><span>10 reps</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Air squat"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li>
      </ol>
    </section>
    <section class="part" id="work" data-component="part" aria-labelledby="work-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon part-icon--work" aria-hidden="true"><MobileIcon name="zap" :size="20" /></span>
        <div><h2 id="work-name">Work</h2><p>4 rounds · about 14 min</p></div>
        <button class="part-add" type="button" data-component="part-add" aria-label="Add to Work"><MobileIcon name="plus" :size="20" /></button>
        
      </div>
      <ol class="steps" data-reorder>
        <li><section class="repeat" data-component="repeat" aria-label="Repeat 4 times">
          <div class="repeat-header"><MobileIcon name="repeat" :size="20" /><strong>Repeat · 4 times</strong>
            <span class="repeat-count" role="group" aria-label="Number of times"><button type="button" aria-label="Fewer times">−</button><span>4 times</span><button type="button" aria-label="More times">+</button></span>
            <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for this repeat"><MobileIcon name="ellipsis-vertical" :size="20" /></button></div>
          <ol class="steps">
        <li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Goblet squat"><span class="step-number" aria-hidden="true">3</span><span class="step-text"><strong>Goblet squat</strong><span>15 reps · 16 kg</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Goblet squat"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li><li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Push-up"><span class="step-number" aria-hidden="true">4</span><span class="step-text"><strong>Push-up</strong><span>10 reps</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Push-up"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li><li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Run"><span class="step-number" aria-hidden="true">5</span><span class="step-text"><strong>Run</strong><span>200 m · 5:00 /km</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Run"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li><li class="step-row step-row--builder" data-component="builder-step-row">
          <button type="button" class="step-main" aria-label="Edit Rest"><span class="step-number step-number--rest" aria-hidden="true"><MobileIcon name="timer" :size="18" /></span><span class="step-text"><MobileRoleTag>Recover</MobileRoleTag><strong>Rest</strong><span>1 min</span></span></button>
          <button class="icon-button icon-button--quiet" type="button" aria-haspopup="menu" aria-label="More actions for Rest"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
        </li>
          </ol>
        </section></li>
      </ol>
    </section>
    <button type="button" class="text-link" data-component="add-part-link"><MobileIcon name="plus" :size="20" />Add a cool down</button>
  </div>
</main>
