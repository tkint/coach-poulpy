name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    name: Shared tests, server and Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Test shared modules and server
        run: ./gradlew jvmTest jsTest :server:test
      - name: Build Android APK
        run: ./gradlew :app-android:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: coach-poulpy-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk

  ios:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd app-ios && xcodegen
      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project app-ios/CoachPoulpy.xcodeproj \
            -scheme CoachPoulpy \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  web:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the generated theme files match design/tokens.json
        run: node ../design/build-tokens.mjs --check
      - run: npm ci
      - run: npm run build
