# Coach Poulpy on one server: the API and its Postgres. HTTPS comes from the shared Caddy
# (deploy/caddy/) on the external `edge` network. Deployed by the Deploy workflow; see
# docs/deploying-the-server.md.

# APP_NAME (in .env) names the project, so a preview with its own name runs beside production.
name: ${APP_NAME:-coach-poulpy}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  server:
    # Published by the Release workflow; never built on the server (ADR 0019).
    image: ghcr.io/tkint/coach-poulpy-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Postgres on the internal network; the server migrates it on start (ADR 0022).
      DATABASE_URL: jdbc:postgresql://postgres:5432/coachpoulpy
      DATABASE_USER: coachpoulpy
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Mail (docs/deploying-the-server.md). With no SMTP_HOST, emails are printed to the log.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WEBSITE_URL: ${WEBSITE_URL:-}
      # The confirmed account with this address becomes an admin on start (docs/admin.md).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    # The heap is 75% of this (server/Dockerfile), which leaves room for the JVM itself.
    mem_limit: 512m
    # No published ports: only Caddy reaches the server, through the edge network.
    expose:
      - "8080"
    networks:
      internal:
      edge:
        # Containers of every app share the edge network, so the server gets a name no other
        # app uses; Caddy proxies to it.
        aliases: ["${APP_NAME:-coach-poulpy}-server"]
    logging: *logging

  # Tables follow ADR 0007; the schema is the server's SQLDelight migrations (ADR 0022).
  postgres:
    # The same major version as the local Postgres in tools/compose.yaml.
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: coachpoulpy
      POSTGRES_USER: coachpoulpy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Only on the internal network: nothing outside this project can reach the database.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachpoulpy -d coachpoulpy"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  # Ships the containers' logs to Grafana Cloud. Off unless .env has COMPOSE_PROFILES=logs, which
  # the Deploy workflow writes when the Loki settings are set (docs/deploying-the-server.md).
  alloy:
    profiles: [logs]
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    environment:
      APP_NAME: ${APP_NAME:-coach-poulpy}
      DEPLOY_ENVIRONMENT: ${DEPLOY_ENVIRONMENT:-production}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_USER: ${LOKI_USER:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to Docker, to find the containers and read their logs. It is root-equivalent
      # on the machine, which is why Alloy has no published port and no network but its own.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 256m
    networks: [internal]
    logging: *logging

networks:
  internal:
  edge:
    external: true

volumes:
  postgres-data:
  alloy-data:
