<main class="phone">
  <iframe class="base-screen" src="iframe.html?id=mobile-screens-home-session-recap--session-recap-sets-full&amp;viewMode=story&amp;embedded" title="Session recap, behind" aria-hidden="true" tabindex="-1" inert></iframe>
  <div class="scrim"></div>
  <MobileSheet id="share-sheet" aria-label="Share this session">
    <span class="sheet-handle"></span>
    <div class="sheet-title"><h2>Share this session</h2><p>Pick a format.</p></div>
    <div class="option-list">
      <MobileOptionRow icon="download" hint="Save it, then import it on the Garmin Connect or Strava website">.FIT file</MobileOptionRow>
      <MobileOptionRow icon="image" hint="A card with your numbers to send or post">Image</MobileOptionRow>
    </div>
  </MobileSheet>
</main>
