<main class="phone" style="--frame-height: 1440px">
  <header class="top-bar">
    <button type="button" class="icon-button" aria-label="Back to the library"><MobileIcon name="chevron-left" /></button>
    <button class="icon-button" type="button" aria-label="More options" aria-haspopup="menu"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
  </header>

  <div class="page-body">
    <div id="workout-summary" style="display: flex; flex-direction: column; gap: var(--cp-space-xs);">
      <span class="label label--primary">Strength</span>
      <h1 class="title" style="font-size: 30px; line-height: 34px;">Full body burner</h1>
      <p class="workout-details">
        <MobileFormatChip id="format" icon="repeat">Circuit</MobileFormatChip>
        <span>8 exercises · about 22 min · dumbbell, mat</span>
      </p>
    </div>

    <button type="button" class="plan-button" data-component="plan-button"><MobileIcon name="calendar-plus" :size="20" />Plan it for a day</button>

    <div class="stat-tiles">
      <MobileStatTile label="Done" value="2 times" />
      <MobileStatTile label="Last time" value="Sat 24" />
      <MobileStatTile label="Usually" value="23 min" />
    </div>

    <section class="part" id="warm-up" data-component="part" aria-labelledby="warm-up-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon" aria-hidden="true"><MobileIcon name="sun" :size="20" /></span>
        <div><h2 id="warm-up-name">Warm-up</h2><p>2 steps · about 2 min</p></div>
      </div>
      <ol class="steps">
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">1</span>
            <span class="step-text"><strong>Jumping jack</strong><span>30 s</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">2</span>
            <span class="step-text"><strong>Air squat</strong><span>10 reps</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
      </ol>
    </section>
    <section class="part" id="work-1" data-component="part" aria-labelledby="work-1-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon part-icon--work" aria-hidden="true"><MobileIcon name="zap" :size="20" /></span>
        <div><h2 id="work-1-name">Work 1</h2><p>4 rounds · about 14 min</p></div>
      </div>
      <ol class="steps">
        <li>
        <section class="repeat" data-component="repeat" aria-label="Repeat 4 times">
          <div class="repeat-header"><MobileIcon name="repeat" :size="20" /><strong>Repeat · 4 times</strong></div>
          <ol class="steps">
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">3</span>
            <span class="step-text"><strong>Goblet squat</strong><span>15 reps · 16 kg</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">4</span>
            <span class="step-text"><strong>Push-up</strong><span>10 reps</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">5</span>
            <span class="step-text"><strong>Run</strong><span>200 m · 5:00 /km</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
        <li class="step-row" data-component="step-row">
          <span class="step-number step-number--rest" aria-hidden="true"><MobileIcon name="timer" :size="18" /></span>
          <span class="step-text"><MobileRoleTag>Recover</MobileRoleTag><strong>Rest</strong><span>1 min</span></span>
        </li>
      </ol>
        </section>
      </li>
      </ol>
    </section>
    <section class="part" id="work-2" data-component="part" aria-labelledby="work-2-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon part-icon--work" aria-hidden="true"><MobileIcon name="zap" :size="20" /></span>
        <div><h2 id="work-2-name">Work 2</h2><p>3 rounds · about 5 min</p></div>
      </div>
      <ol class="steps">
        <li>
        <section class="repeat" data-component="repeat" aria-label="Repeat 3 times">
          <div class="repeat-header"><MobileIcon name="repeat" :size="20" /><strong>Repeat · 3 times</strong></div>
          <ol class="steps">
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">6</span>
            <span class="step-text"><strong>Plank</strong><span>40 s hold</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">7</span>
            <span class="step-text"><strong>Crunch</strong><span>15 reps</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
      </ol>
        </section>
      </li>
      </ol>
    </section>
    <section class="part" id="cool-down" data-component="part" aria-labelledby="cool-down-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon" aria-hidden="true"><MobileIcon name="moon" :size="20" /></span>
        <div><h2 id="cool-down-name">Cool down</h2><p>1 step · 1 min</p></div>
      </div>
      <ol class="steps">
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">8</span>
            <span class="step-text"><strong>Hamstring stretch</strong><span>30 s hold · each side</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
      </ol>
    </section>
  </div>

  <div class="action-bar">
    <MobileButton kind="secondary" icon="pencil" :icon-size="18" style="flex: 1; font-size: 16px;">Edit</MobileButton>
    <MobileButton icon="play" :icon-size="18" style="flex: 1.6;">Start now</MobileButton>
  </div>
</main>
