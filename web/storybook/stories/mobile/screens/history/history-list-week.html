<main class="phone">
  <div class="history-head">
    <h1>History</h1>
    <div class="view-tabs" role="tablist" aria-label="History view">
      <button type="button" role="tab" aria-selected="true"><MobileIcon name="list" :size="18" />Sessions</button>
      <button type="button" role="tab" aria-selected="false"><MobileIcon name="chart-no-axes-column" :size="18" />Stats</button>
    </div>
  </div>
  <section class="month-card month-card--week" aria-label="Week of 19 October 2026" data-component="week-strip">
    <div class="weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="days" role="group" aria-label="Days of the week, swipe for other weeks">
      <div><button type="button" class="day" aria-label="Mon 19 October" aria-pressed="false">19</button></div>
      <div><button type="button" class="day" aria-label="Tue 20 October" aria-pressed="false">20</button></div>
      <div><button type="button" class="day day--active" aria-label="Wed 21 October, 1 session" aria-pressed="false">21</button></div>
      <div><button type="button" class="day" aria-label="Thu 22 October" aria-pressed="false">22</button></div>
      <div><button type="button" class="day day--active" aria-label="Fri 23 October, 1 session" aria-pressed="false">23</button></div>
      <div><button type="button" class="day day--active day--today day--selected" aria-label="Sat 24 October, 1 session, today" aria-pressed="true">24</button></div>
      <div><button type="button" class="day day--future" aria-label="Sun 25 October" aria-pressed="false">25</button></div>
    </div>
    <button type="button" class="card-toggle" aria-expanded="false" aria-controls="month" aria-label="Open the month, October 2026"><span>October 2026</span><MobileIcon name="chevron-down" :size="20" /></button>
  </section>
  <div class="history-filters">
    <MobileSearchField label="Search sessions" placeholder="Session or exercise name" />
    <div class="chip-row" role="group" aria-label="Filters">
      <MobileFilterChip icon="dumbbell" aria-haspopup="dialog" aria-label="Equipment" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="target" aria-haspopup="dialog" aria-label="Focus" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="person-standing" aria-haspopup="dialog" aria-label="Zones" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="timer" aria-haspopup="dialog" aria-label="Duration" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="route" aria-haspopup="dialog" aria-label="Distance" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
    </div>
  </div>
  <div class="day-list" id="day-sessions">
      <div class="day-heading"><span class="label label--primary">Today · Sat 24 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="dumbbell" :size="22" /></span><span><strong>Lower body strength</strong><small>18:05 · 38:24 · 17 of 18 sets</small></span></button>
      <div class="day-heading"><span class="label">Fri 23 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="gauge" :size="22" /></span><span><strong>Treadmill</strong><small>07:30 · 24:00 · 3.42 km</small></span></button>
      <div class="day-heading"><span class="label">Wed 21 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="dumbbell" :size="22" /></span><span><strong>Upper body</strong><small>18:40 · 32:10 · 15 of 15 sets</small></span></button>
      <div class="day-heading"><span class="label">Sat 17 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="gauge" :size="22" /></span><span><strong>Treadmill</strong><small>09:15 · 30:00 · 4.10 km</small></span></button>
      <div class="day-heading"><span class="label">Fri 16 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="dumbbell" :size="22" /></span><span><strong>Full body</strong><small>19:00 · 41:05 · 20 of 21 sets</small></span></button>
      <div class="day-heading"><span class="label">Wed 14 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="gauge" :size="22" /></span><span><strong>Treadmill</strong><small>07:20 · 20:00 · 2.80 km</small></span></button>
      <div class="day-heading"><span class="label">Mon 12 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="dumbbell" :size="22" /></span><span><strong>Lower body strength</strong><small>18:10 · 36:50 · 18 of 18 sets</small></span></button>
      <div class="day-heading"><span class="label">Fri 9 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="gauge" :size="22" /></span><span><strong>Treadmill</strong><small>07:45 · 25:00 · 3.05 km</small></span></button>
  </div>
  <MobileNavBar active="history" />
</main>
