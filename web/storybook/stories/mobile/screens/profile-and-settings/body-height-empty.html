<main class="phone">

  <header class="page-bar"><button type="button" class="icon-button" aria-label="Back to settings"><MobileIcon name="chevron-left" :size="22" /></button><div><h1>Height</h1><span class="muted">Nothing logged yet</span></div><button class="small-button" type="button" data-component="small-button">Log</button></header>
  <div class="settings-body" style="padding-top: var(--cp-space-lg); gap: var(--cp-space-md);">
    <section class="empty-card" id="height-empty" data-component="empty-card" aria-label="No height yet">
      <img src="../../../poulpy/mood_happy.svg" alt="Poulpy, happy">
      <h2>No height yet</h2>
      <p>Log it once to see your chart. A measure every few months is plenty.</p>
      <MobileButton icon="plus" :icon-size="22">Log your height</MobileButton>
    </section>
  </div>
</main>
