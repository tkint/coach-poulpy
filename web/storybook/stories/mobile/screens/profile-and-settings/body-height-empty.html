  <MobileTopBar title="Height" leading="back" back-label="Back to settings"><MobileButton size="sm">Log</MobileButton></MobileTopBar>
  <p class="app-bar-sub">Nothing logged yet</p>
  <div class="settings-body" style="padding-top: var(--cp-space-lg); gap: var(--cp-space-md);">

      Log it once to see your chart. A measure every few months is plenty.
      <template #action><MobileButton kind="secondary" size="sm" icon="plus">Log your height</MobileButton></template>
    </MobileEmptyState>
  </div>
</main>
