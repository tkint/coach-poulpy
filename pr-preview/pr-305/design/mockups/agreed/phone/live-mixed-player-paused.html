<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · mixed workout, paused on a strength step</title>
<meta name="mockup:screen" content="live-mixed-player-paused">
<meta name="mockup:section" content="Live">
<meta name="mockup:issue" content="220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/ui/src/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone player player--paused">
  <div class="session-progress" id="session-progress">
    <button class="pause-button pause-button--paused" data-component="pause-button" id="pause-button" type="button" aria-label="Resume"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></button>
    <div>
      <span class="label numbers">Step 3 of 6 · 14:20</span>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="3" aria-label="Session progress"><div style="width: 50%;"></div></div>
    </div>
    <a class="icon-button icon-button--filled" href="#" aria-label="End session"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>
  <div class="paused-card" id="paused" data-component="paused-card" role="status"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg><strong>Paused</strong></div>
  <section class="live-numbers" id="live-numbers" aria-label="Live numbers" data-component="live-numbers">
    <div class="live-tile live-tile--small"><span class="label">Heart rate <span>· band</span></span><span class="value">121 <small>bpm</small></span></div>
  </section>

  <div class="player-step" id="current-step">
    <img src="../../../poulpy/pose_straining.svg" alt="Poulpy straining">
    <span class="part-line" id="part-line" data-component="part-line">Work</span>
    <h1 class="title">Bodyweight squats</h1>
    <span class="set-count numbers">Set 2 of 3</span>
    <div class="set-dots" aria-hidden="true"><span class="done"></span><span class="current"></span><span></span></div>
    <span class="target-value">15</span>
    <span class="target-unit">reps</span>
  </div>
  <div class="next-card" id="next-step" data-component="next-card"><span class="label">Next</span><span>Rest 1 min, then set 3</span></div>
  <div class="player-actions">
    <button class="secondary-button secondary-button--large" data-component="secondary-button" type="button" disabled>Skip</button>
    <a class="primary-button primary-button--large" data-component="primary-button" aria-disabled="true">Done</a>
  </div>
</main>
</body>
</html>
