<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body · log a height (imperial)</title>
<meta name="mockup:screen" content="body-log-height-sheet">
<meta name="mockup:section" content="Profile and settings">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">

  <header class="page-bar"><a class="icon-button" href="body-height.html" aria-label="Back to height"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><div><h1>Height</h1></div></header>
  <div class="scrim"></div>
  <section class="sheet" id="log-sheet" data-component="sheet" role="dialog" aria-label="Log your height">
    <span class="sheet-handle"></span>
    <div class="sheet-title"><h2>Log your height</h2><p>Type it, or nudge it with − and +. Stored in centimetres, shown in your units.</p></div>
    <div class="number-entry" data-component="number-entry"><button type="button" aria-label="Less">−</button><span class="number-field number-field--large"><input inputmode="numeric" value="5" aria-label="Feet" autofocus><span class="unit">ft</span></span><span class="number-field number-field--large"><input inputmode="decimal" value="9" aria-label="Inches"><span class="unit">in</span></span><button type="button" aria-label="More">+</button></div>
    <button class="select-field" type="button" data-component="select-field"><span><span class="label">Date</span><strong>Today, 1 November</strong></span><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="sheet-actions"><button class="secondary-button" type="button">Cancel</button><button class="primary-button" type="button" style="flex: 1;">Save</button></div>
  </section>
</main>
</body>
</html>
