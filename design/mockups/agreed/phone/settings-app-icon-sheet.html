<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · choose an app icon</title>
<meta name="mockup:screen" content="settings-app-icon-sheet">
<meta name="mockup:section" content="Profile and settings">
<meta name="mockup:issue" content="177">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/ui/src/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">
  <div class="settings-head"><h1>Settings</h1></div>
  <div class="scrim"></div>
  <section class="sheet" id="app-icon-sheet" data-component="option-sheet" role="dialog" aria-modal="true" aria-labelledby="app-icon-title" aria-describedby="app-icon-description app-icon-ios-note">
    <span class="sheet-handle" aria-hidden="true"></span>
    <div class="sheet-title">
      <h2 id="app-icon-title">App icon</h2>
      <p id="app-icon-description">Pick Poulpy’s face for your home screen. This doesn’t change Poulpy’s mood in the app.</p>
    </div>
    <div class="option-list" id="app-icon-choices" role="radiogroup" aria-label="App icon">
      <label class="option-row" data-component="option-row"><img src="../../../poulpy/mood_happy.svg" width="48" height="48" alt="" aria-hidden="true"><span>Happy · default</span><input type="radio" name="app-icon" value="happy" checked></label>
      <label class="option-row" data-component="option-row"><img src="../../../poulpy/mood_proud.svg" width="48" height="48" alt="" aria-hidden="true"><span>Proud</span><input type="radio" name="app-icon" value="proud"></label>
      <label class="option-row" data-component="option-row"><img src="../../../poulpy/mood_annoyed.svg" width="48" height="48" alt="" aria-hidden="true"><span>Annoyed</span><input type="radio" name="app-icon" value="annoyed"></label>
      <label class="option-row" data-component="option-row"><img src="../../../poulpy/mood_grumpy.svg" width="48" height="48" alt="" aria-hidden="true"><span>Grumpy</span><input type="radio" name="app-icon" value="grumpy"></label>
      <label class="option-row" data-component="option-row"><img src="../../../poulpy/pose_champion.svg" width="48" height="48" alt="" aria-hidden="true"><span>Champion</span><input type="radio" name="app-icon" value="champion"></label>
      <label class="option-row" data-component="option-row"><img src="../../../poulpy/pose_cocky.svg" width="48" height="48" alt="" aria-hidden="true"><span>Cocky</span><input type="radio" name="app-icon" value="cocky"></label>
    </div>
    <p class="field-note">Tap an icon to apply it and close this sheet.</p>
    <p class="field-note" id="app-icon-ios-note">On iOS, your phone shows a system alert after the icon changes.</p>
    <div class="sheet-actions"><a class="secondary-button" href="settings-general.html#app-icon" data-component="outline-button">Cancel</a></div>
  </section>
</main>
</body>
</html>
