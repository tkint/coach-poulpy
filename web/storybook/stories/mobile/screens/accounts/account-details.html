<main class="phone">
  <header class="page-bar"><a class="icon-button" href="#" aria-label="Back to settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-left"><path d="m15 18-6-6 6-6"/></svg></a><div><h1>Account</h1></div></header>
  <div class="form-body" style="padding-top: var(--cp-space-lg);">

    </div>
  </div>
