<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · pronouns</title>
<meta name="mockup:screen" content="profile-pronouns-sheet">
<meta name="mockup:section" content="Profile and settings">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">

  <header class="page-bar"><a class="icon-button" href="profile-edit.html" aria-label="Back to profile"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><div><h1>Your profile</h1></div></header>
  <div class="scrim"></div>
  <section class="sheet" id="pronouns-sheet" data-component="sheet" role="dialog" aria-label="Pronouns">
    <span class="sheet-handle"></span>
    <div class="sheet-title"><h2>Pronouns</h2><p>Used for French wording and Poulpy’s lines.</p></div>
    <div class="option-list" role="radiogroup" aria-label="Pronouns"><label class="option-row" data-component="option-row"><span>Not set</span><input type="radio" name="pronouns"></label><label class="option-row" data-component="option-row"><span>She / her</span><input type="radio" name="pronouns"></label><label class="option-row" data-component="option-row"><span>He / him</span><input type="radio" name="pronouns"></label><label class="option-row" data-component="option-row"><span>They / them</span><input type="radio" name="pronouns"></label><label class="option-row" data-component="option-row"><span>Just my name</span><input type="radio" name="pronouns"></label><label class="option-row" data-component="option-row"><span>Custom</span><input type="radio" name="pronouns" checked></label><label class="option-row" data-component="option-row"><span>Prefer not to say</span><input type="radio" name="pronouns"></label></div>
    <div class="field" id="custom-pronouns-field"><label class="label" for="custom-pronouns">Your pronouns, in your own words</label><input class="text-field" id="custom-pronouns" value="ze / hir" data-component="text-field"></div>
    <div class="sheet-actions"><button class="primary-button" type="button" style="flex: 1;">Save</button></div>
  </section>
</main>
</body>
</html>
