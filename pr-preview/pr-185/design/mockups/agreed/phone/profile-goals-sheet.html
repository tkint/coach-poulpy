<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · goals</title>
<meta name="mockup:screen" content="profile-goals-sheet">
<meta name="mockup:section" content="Profile and settings">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">

  <header class="page-bar"><a class="icon-button" href="profile-edit.html" aria-label="Back to profile"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><div><h1>Your profile</h1></div></header>
  <div class="scrim"></div>
  <section class="sheet" id="goals-sheet" data-component="sheet" role="dialog" aria-label="Goals">
    <span class="sheet-handle"></span>
    <div class="sheet-title"><h2>Goals</h2><p>Pick as many as you like. Poulpy suggests workouts for all of them.</p></div>
    <div class="option-list" role="group" aria-label="Goals"><label class="option-row" data-component="option-row"><span>Stay active</span><input type="checkbox" name="goals"></label><label class="option-row" data-component="option-row"><span>Build strength</span><input type="checkbox" name="goals" checked></label><label class="option-row" data-component="option-row"><span>Run further</span><input type="checkbox" name="goals" checked></label><label class="option-row" data-component="option-row"><span>Rehab</span><input type="checkbox" name="goals"></label><label class="option-row" data-component="option-row"><span>Something else</span><input type="checkbox" name="goals"></label></div>
    <div class="sheet-actions"><button class="primary-button" type="button" style="flex: 1;">Save</button></div>
  </section>
</main>
</body>
</html>
