 Kotlin Multiplatform core for every platform\",\"link\":\"/docs/adr/0002-one-kotlin-multiplatform-core\"},{\"text\":\"0003 · Sessions are stored as append-only event logs\",\"link\":\"/docs/adr/0003-sessions-are-append-only-event-logs\"},{\"text\":\"0004 · Workout types are modules over one engine\",\"link\":\"/docs/adr/0004-workout-types-are-modules-over-one-engine\"},{\"text\":\"0005 · Ids are UUIDv7 made on the device\",\"link\":\"/docs/adr/0005-ids-are-uuidv7-made-on-the-device\"},{\"text\":\"0006 · Sync keeps both conflicting edits\",\"link\":\"/docs/adr/0006-sync-keeps-both-edits\"},{\"text\":\"0007 · Postgres: columns for structure, JSONB for content\",\"link\":\"/docs/adr/0007-postgres-columns-for-structure-jsonb-for-content\"},{\"text\":\"0008 · A curated catalog with stable slugs, updated without an account\",\"link\":\"/docs/adr/0008-curated-catalog-with-stable-slugs\"},{\"text\":\"0009 · Shared plans are saved synced or as a copy; enrollments pin a version\",\"link\":\"/docs/adr/0009-shared-plans-are-synced-or-copied\"},{\"text\":\"0010 · Treadmills are read-only metric sources in v1\",\"link\":\"/docs/adr/0010-treadmills-are-read-only-metric-sources\"},{\"text\":\"0011 · A .FIT file export instead of Garmin and Strava APIs\",\"link\":\"/docs/adr/0011-fit-file-export-instead-of-fitness-apis\"},{\"text\":\"0012 · Design tokens are generated from one file\",\"link\":\"/docs/adr/0012-design-tokens-generated-from-one-file\"},{\"text\":\"0013 · Workouts have a format, not a type\",\"link\":\"/docs/adr/0013-workouts-have-a-format-not-a-type\"},{\"text\":\"0014 · Text lives in one JSON file per language and namespace\",\"link\":\"/docs/adr/0014-text-lives-in-one-json-file-per-language-and-namespace\"},{\"text\":\"0015 · Catalog text lives in translation files\",\"link\":\"/docs/adr/0015-catalog-text-lives-in-translation-files\"},{\"text\":\"0016 · Mockups are plain HTML in the repo\",\"link\":\"/docs/adr/0016-mockups-are-plain-html-in-the-repo\"},{\"text\":\"0
