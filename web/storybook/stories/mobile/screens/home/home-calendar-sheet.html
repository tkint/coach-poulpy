<main class="phone">
  <MobileTopBar title="Home"><MobileButton size="sm" icon="circle-dot">Record</MobileButton></MobileTopBar>
  <div class="page-body" style="padding-top: var(--cp-space-sm); padding-bottom: 0; gap: var(--cp-space-sm);">
    <MobileMotivationRow :lit="5" label="5 of 8 tentacles lit. Open achievements." picture="../../../poulpy/mood_happy.svg" picture-alt="Poulpy, happy"><MobileAchievement icon="award" name="First record" /><MobileAchievement icon="target" name="Goal met" /><MobileAchievement locked name="" /></MobileMotivationRow>
    <span class="label label-row">Up next</span>
    <button type="button" class="list-row card--highlight" id="up-next" data-component="list-row" style="border-radius: var(--cp-radius-lg); padding: var(--cp-space-sm); border: 1.5px solid color-mix(in srgb, var(--cp-primary) 50%, transparent);">
      <span class="row-icon" aria-hidden="true"><MobileIcon name="dumbbell" :size="22" /></span>
      <span class="row-text"><strong>Lower body strength</strong><span>Today · Sets · about 40 min</span></span>
      <span class="chevron"><MobileIcon name="chevron-right" :size="20" /></span>
    </button>
    <button type="button" class="list-row" id="tomorrow" data-component="list-row" style="border-radius: var(--cp-radius-lg); padding: var(--cp-space-sm);">
      <span class="row-icon" aria-hidden="true"><MobileIcon name="gauge" :size="22" /></span>
      <span class="row-text"><strong>Easy run</strong><span>Tomorrow · about 25 min</span></span>
      <span class="chevron"><MobileIcon name="chevron-right" :size="20" /></span>
    </button>
    <div class="section-head" style="margin-top: var(--cp-space-xs);"><span class="label">Past</span><span class="section-actions"><MobileIconButton icon="search" :icon-size="16" aria-label="Search sessions" /><MobileIconButton icon="calendar" :icon-size="16" id="calendar-button" aria-label="Jump to a day" /></span></div>
    <div class="feed-scroll" id="feed-scroll">
    <div class="timeline" id="past">
      <div class="day-heading"><span class="label label--primary">This week</span></div>
      <button type="button" class="feed-card" id="week-recap"><span><strong>Your week</strong><small>4 sessions · 2 h 10 · legs most worked</small></span><MobileIcon name="chevron-right" :size="20" /></button>
      <div class="day-heading"><span class="label">Thu 22 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="dumbbell" :size="22" /></span><span><strong>Upper body</strong><small>32:10 · 15 of 15 sets</small></span></button>
      <div class="feed-card" id="record-card"><MobileAchievement icon="award" name="First record" /><span><strong>New record</strong><small>Goblet squat, 24 kg</small></span></div>
      <div class="day-heading"><span class="label">Tue 20 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="gauge" :size="22" /></span><span><strong>Easy run</strong><small>24:00 · 3.4 km</small></span></button>
      <div class="day-heading"><span class="label">Sat 17 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="gauge" :size="22" /></span><span><strong>Easy run</strong><small>30:00 · 4.1 km</small></span></button>
      <div class="day-heading"><span class="label">Fri 16 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="dumbbell" :size="22" /></span><span><strong>Full body</strong><small>41:05 · 20 of 21 sets</small></span></button>
      <div class="day-heading"><span class="label">Wed 14 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="gauge" :size="22" /></span><span><strong>Easy run</strong><small>20:00 · 2.8 km</small></span></button>
    </div>
    </div>
  </div>
  <MobileNavBar active="home" />

  <div class="scrim" aria-hidden="true"></div>
  <!-- The platform's own date picker (Material dialog on Android, graphical DatePicker on iOS), drawn in the app's theme. -->
  <div class="dialog" role="dialog" aria-label="Jump to a day" style="top: 0; display: flex; align-items: center;">
    <div style="width: 100%; gap: var(--cp-space-xs);">
      <span class="label">Jump to a day</span>
      <h2 style="text-align: left;">Wed 21 Oct</h2>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <strong>October 2026</strong>
        <span style="display: flex; gap: 4px; color: var(--cp-primary);"><MobileIcon name="chevron-left" :size="22" /><MobileIcon name="chevron-right" :size="22" /></span>
      </div>
      <div class="weekdays" aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div role="group" aria-label="Days of October" style="display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px;"><span></span><span></span><span></span><button type="button" class="day" style="margin: 0 auto;">1</button><button type="button" class="day" style="margin: 0 auto;">2</button><button type="button" class="day" style="margin: 0 auto;">3</button><button type="button" class="day" style="margin: 0 auto;">4</button><button type="button" class="day" style="margin: 0 auto;">5</button><button type="button" class="day" style="margin: 0 auto;">6</button><button type="button" class="day" style="margin: 0 auto;">7</button><button type="button" class="day" style="margin: 0 auto;">8</button><button type="button" class="day" style="margin: 0 auto;">9</button><button type="button" class="day" style="margin: 0 auto;">10</button><button type="button" class="day" style="margin: 0 auto;">11</button><button type="button" class="day" style="margin: 0 auto;">12</button><button type="button" class="day" style="margin: 0 auto;">13</button><button type="button" class="day" style="margin: 0 auto;">14</button><button type="button" class="day" style="margin: 0 auto;">15</button><button type="button" class="day" style="margin: 0 auto;">16</button><button type="button" class="day" style="margin: 0 auto;">17</button><button type="button" class="day" style="margin: 0 auto;">18</button><button type="button" class="day" style="margin: 0 auto;">19</button><button type="button" class="day" style="margin: 0 auto;">20</button><button type="button" class="day day--today" style="margin: 0 auto;">21</button><button type="button" class="day day--future" style="margin: 0 auto;" disabled>22</button><button type="button" class="day day--future" style="margin: 0 auto;" disabled>23</button><button type="button" class="day day--future" style="margin: 0 auto;" disabled>24</button><button type="button" class="day day--future" style="margin: 0 auto;" disabled>25</button><button type="button" class="day day--future" style="margin: 0 auto;" disabled>26</button><button type="button" class="day day--future" style="margin: 0 auto;" disabled>27</button><button type="button" class="day day--future" style="margin: 0 auto;" disabled>28</button><button type="button" class="day day--future" style="margin: 0 auto;" disabled>29</button><button type="button" class="day day--future" style="margin: 0 auto;" disabled>30</button><button type="button" class="day day--future" style="margin: 0 auto;" disabled>31</button></div>
      <div class="actions" style="justify-content: flex-end; margin-top: var(--cp-space-xs);"><MobileButton kind="secondary" size="sm">Cancel</MobileButton><MobileButton size="sm">Done</MobileButton></div>
    </div>
  </div>
</main>
