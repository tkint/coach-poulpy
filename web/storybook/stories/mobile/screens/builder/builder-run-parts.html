<main class="phone" style="--frame-height: 1040px">
<header class="top-bar" style="padding: var(--cp-space-xxxl) var(--cp-space-md) var(--cp-space-sm); justify-content: flex-start; gap: var(--cp-space-xs);">
    <button type="button" class="icon-button" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <h1 class="headline" style="flex: 1;">New workout</h1>
    <MobileButton kind="small">Save</MobileButton>
  </header>

  <div class="form-body">
    <label class="field">
      <span class="label">Name</span>
      <input class="text-field" type="text" value="Easy run and 400 m">
    </label>
    <div class="format-line" id="format" data-component="format-line">
      <span class="label">Format</span>
      <MobileFormatChip icon="repeat">Circuit</MobileFormatChip>
      <span class="muted"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>chosen at creation</span>
    </div>
    <section class="builder-part" id="warm-up" data-component="builder-part" aria-labelledby="warm-up-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
        <div><h2 id="warm-up-name">Warm-up</h2><p>1 step · about 12 min</p></div>
        <button class="icon-button" type="button" aria-haspopup="menu" aria-label="More actions for Warm-up"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
      </div>
      <ol class="steps" data-reorder>
      <li class="step-card" data-component="builder-step">
          <span class="move-buttons" role="group" aria-label="Move Run"><button type="button" data-move="up" aria-label="Move Run up"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-up"><path d="m18 15-6-6-6 6"/></svg></button><button type="button" data-move="down" aria-label="Move Run down"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-down"><path d="m6 9 6 6 6-6"/></svg></button></span>
          <span class="row-text"><strong>Run</strong><span>2 km · 6:00 /km</span></span>
          <button class="icon-button" type="button" aria-haspopup="menu" aria-label="More actions for Run"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
        </li>
      </ol>
      <button type="button" class="add-to-part" data-component="add-to-part"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add to warm-up</button>
    </section>
    <section class="builder-part" id="work" data-component="builder-part" aria-labelledby="work-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon part-icon--work" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="zap"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></svg></span>
        <div><h2 id="work-name">Work</h2><p>6 rounds · about 20 min</p></div>
        <button class="icon-button" type="button" aria-haspopup="menu" aria-label="More actions for Work"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
      </div>
      <ol class="steps" data-reorder>
      <li class="builder-repeat" data-component="builder-repeat" aria-label="Repeat 6 times">
        <div>
          <span class="move-buttons" role="group" aria-label="Move this repeat"><button type="button" data-move="up" aria-label="Move this repeat up"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-up"><path d="m18 15-6-6-6 6"/></svg></button><button type="button" data-move="down" aria-label="Move this repeat down"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-down"><path d="m6 9 6 6 6-6"/></svg></button></span>
          <span class="repeat-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="repeat"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></span>
          <strong>Repeat</strong>
          <span class="repeat-count" role="group" aria-label="Number of times"><button type="button" aria-label="Fewer times">−</button><span>6 times</span><button type="button" aria-label="More times">+</button></span>
          <button class="icon-button" type="button" aria-haspopup="menu" aria-label="More actions for this repeat" style="width: 36px; color: var(--cp-on-surface-variant);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
        </div>
        <ol class="steps" data-reorder>
        <li class="step-card" data-component="builder-step">
          <span class="move-buttons" role="group" aria-label="Move Run"><button type="button" data-move="up" aria-label="Move Run up"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-up"><path d="m18 15-6-6-6 6"/></svg></button><button type="button" data-move="down" aria-label="Move Run down"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-down"><path d="m6 9 6 6 6-6"/></svg></button></span>
          <span class="row-text"><strong>Run</strong><span>400 m · 4:30 /km</span></span>
          <button class="icon-button" type="button" aria-haspopup="menu" aria-label="More actions for Run"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
        </li><li class="step-card" data-component="builder-step">
          <span class="move-buttons" role="group" aria-label="Move Walk"><button type="button" data-move="up" aria-label="Move Walk up"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-up"><path d="m18 15-6-6-6 6"/></svg></button><button type="button" data-move="down" aria-label="Move Walk down"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-down"><path d="m6 9 6 6 6-6"/></svg></button></span>
          <span class="row-text"><MobileRoleTag>Recover</MobileRoleTag><strong>Walk</strong><span>1 min 30 s</span></span>
          <button class="icon-button" type="button" aria-haspopup="menu" aria-label="More actions for Walk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
        </li>
        </ol>
      </li>
      </ol>
      <button type="button" class="add-to-part" data-component="add-to-part"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add to Work</button>
    </section>
    <section class="builder-part" id="cool-down" data-component="builder-part" aria-labelledby="cool-down-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></span>
        <div><h2 id="cool-down-name">Cool down</h2><p>1 step · until the end</p></div>
        <button class="icon-button" type="button" aria-haspopup="menu" aria-label="More actions for Cool down"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
      </div>
      <ol class="steps" data-reorder>
      <li class="step-card" data-component="builder-step">
          <span class="move-buttons" role="group" aria-label="Move Walk"><button type="button" data-move="up" aria-label="Move Walk up"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-up"><path d="m18 15-6-6-6 6"/></svg></button><button type="button" data-move="down" aria-label="Move Walk down"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-down"><path d="m6 9 6 6 6-6"/></svg></button></span>
          <span class="row-text"><strong>Walk</strong><span>until the end</span></span>
          <button class="icon-button" type="button" aria-haspopup="menu" aria-label="More actions for Walk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="ellipsis-vertical"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
        </li>
      </ol>
      <button type="button" class="add-to-part" data-component="add-to-part"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add to cool down</button>
    </section>
    <button type="button" class="add-button" data-component="add-part-button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add a part</button>
  </div>
</main>
