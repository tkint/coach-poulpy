<main class="phone">
  <MobileTopBar title="Home"><MobileButton size="sm" icon="circle-dot">Record</MobileButton></MobileTopBar>
  <div class="page-body" style="padding-top: var(--cp-space-sm); gap: var(--cp-space-sm);">
    <MobileMotivationRow :lit="5" label="5 of 8 tentacles lit. Open achievements." picture="../../../poulpy/mood_happy.svg" picture-alt="Poulpy, happy"><MobileAchievement icon="award" name="First record" /><MobileAchievement icon="target" name="Goal met" /><MobileAchievement locked name="" /></MobileMotivationRow>
    <span class="label label-row">Up next</span>
    <button type="button" class="list-row card--highlight" id="up-next" data-component="list-row" style="border-radius: var(--cp-radius-lg); padding: var(--cp-space-sm); border: 1.5px solid color-mix(in srgb, var(--cp-primary) 50%, transparent);">
      <span class="row-icon" aria-hidden="true"><MobileIcon name="dumbbell" :size="22" /></span>
      <span class="row-text"><strong>Lower body strength</strong><span>Today · Sets · about 40 min</span></span>
      <span class="chevron"><MobileIcon name="chevron-right" :size="20" /></span>
    </button>
    <button type="button" class="list-row" id="tomorrow" data-component="list-row" style="border-radius: var(--cp-radius-lg); padding: var(--cp-space-sm);">
      <span class="row-icon" aria-hidden="true"><MobileIcon name="gauge" :size="22" /></span>
      <span class="row-text"><strong>Easy run</strong><span>Tomorrow · about 25 min</span></span>
      <span class="chevron"><MobileIcon name="chevron-right" :size="20" /></span>
    </button>
    <div class="section-head" style="margin-top: var(--cp-space-xs);"><span class="label">Past</span><MobileButton kind="tonal" size="sm" icon="calendar" id="calendar-button">Calendar</MobileButton></div>
    <div class="timeline" id="past">
      <div class="day-heading"><span class="label label--primary">This week</span></div>
      <button type="button" class="feed-card" id="week-recap"><span><strong>Your week</strong><small>4 sessions · 2 h 10 · legs most worked</small></span><MobileIcon name="chevron-right" :size="20" /></button>
      <div class="day-heading"><span class="label">Thu 22 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="dumbbell" :size="22" /></span><span><strong>Upper body</strong><small>32:10 · 15 of 15 sets</small></span></button>
      <div class="feed-card" id="record-card"><MobileAchievement icon="award" name="First record" /><span><strong>New record</strong><small>Goblet squat, 24 kg</small></span></div>
      <div class="day-heading"><span class="label">Tue 20 Oct</span></div>
      <button type="button" class="session-row" data-component="session-row"><span class="row-icon" aria-hidden="true"><MobileIcon name="gauge" :size="22" /></span><span><strong>Easy run</strong><small>24:00 · 3.4 km</small></span></button>
    </div>
  </div>
  <MobileNavBar active="home" />

  <div class="scrim" aria-hidden="true"></div>
  <MobileSheet id="calendar-sheet" aria-label="Jump to a day" style="gap: var(--cp-space-sm);">
    <span class="sheet-handle" aria-hidden="true"></span>
    <div class="sheet-head" style="padding: 0;">
      <div class="sheet-title" style="flex: 1;"><h2>Jump to a day</h2><p>Tap a day and the timeline scrolls to it.</p></div>
      <button type="button" class="icon-button" aria-label="Close"><MobileIcon name="x" :size="22" /></button>
    </div>
  <section class="month-card" style="margin: 0;" id="month" aria-label="October 2026" data-component="month-card">
      <header>
        <button class="step" type="button" aria-label="Previous month, September"><MobileIcon name="chevron-left" :size="22" /></button>
        <div><h2>October 2026</h2><span class="sub">12 active days · tap a day to jump to it</span></div>
        <button class="step" type="button" aria-label="Next month, November" disabled><MobileIcon name="chevron-right" :size="22" /></button>
      </header>
      <div class="weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="days" role="grid">
        <div></div>
        <div></div>
        <div></div>
        <div><span class="day" role="gridcell" aria-label="Thu 1 October" aria-selected="false">1</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Fri 2 October, 1 session" aria-selected="false">2</span></div>
        <div><span class="day" role="gridcell" aria-label="Sat 3 October" aria-selected="false">3</span></div>
        <div><span class="day" role="gridcell" aria-label="Sun 4 October" aria-selected="false">4</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Mon 5 October, 1 session" aria-selected="false">5</span></div>
        <div><span class="day" role="gridcell" aria-label="Tue 6 October" aria-selected="false">6</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Wed 7 October, 1 session" aria-selected="false">7</span></div>
        <div><span class="day" role="gridcell" aria-label="Thu 8 October" aria-selected="false">8</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Fri 9 October, 1 session" aria-selected="false">9</span></div>
        <div><span class="day" role="gridcell" aria-label="Sat 10 October" aria-selected="false">10</span></div>
        <div><span class="day" role="gridcell" aria-label="Sun 11 October" aria-selected="false">11</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Mon 12 October, 1 session" aria-selected="false">12</span></div>
        <div><span class="day" role="gridcell" aria-label="Tue 13 October" aria-selected="false">13</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Wed 14 October, 1 session" aria-selected="false">14</span></div>
        <div><span class="day" role="gridcell" aria-label="Thu 15 October" aria-selected="false">15</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Fri 16 October, 1 session" aria-selected="false">16</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Sat 17 October, 1 session" aria-selected="false">17</span></div>
        <div><span class="day" role="gridcell" aria-label="Sun 18 October" aria-selected="false">18</span></div>
        <div><span class="day" role="gridcell" aria-label="Mon 19 October" aria-selected="false">19</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Tue 20 October, 1 session" aria-selected="false">20</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Wed 21 October, 1 session" aria-selected="false">21</span></div>
        <div><span class="day day--active day--selected" role="gridcell" aria-label="Thu 22 October, 1 session" aria-selected="true">22</span></div>
        <div><span class="day day--active" role="gridcell" aria-label="Fri 23 October, 1 session" aria-selected="false">23</span></div>
        <div><span class="day day--active day--today" role="gridcell" aria-label="Sat 24 October, 1 session, today" aria-selected="false">24</span></div>
        <div><span class="day day--future" role="gridcell" aria-label="Sun 25 October" aria-selected="false">25</span></div>
        <div><span class="day day--future" role="gridcell" aria-label="Mon 26 October" aria-selected="false">26</span></div>
        <div><span class="day day--future" role="gridcell" aria-label="Tue 27 October" aria-selected="false">27</span></div>
        <div><span class="day day--future" role="gridcell" aria-label="Wed 28 October" aria-selected="false">28</span></div>
        <div><span class="day day--future" role="gridcell" aria-label="Thu 29 October" aria-selected="false">29</span></div>
        <div><span class="day day--future" role="gridcell" aria-label="Fri 30 October" aria-selected="false">30</span></div>
        <div><span class="day day--future" role="gridcell" aria-label="Sat 31 October" aria-selected="false">31</span></div>
      </div>
    </section>
  </MobileSheet>
</main>
