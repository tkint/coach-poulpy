<main class="phone">
<MobileTopBar title="Swap Goblet squat" leading="back" />
<div class="screen-header" style="padding-top: 0; padding-bottom: var(--cp-space-sm); gap: var(--cp-space-md);">
    <span class="muted" style="font-size: 13.5px; line-height: 18px; font-weight: 700;">Keeps 3 × 8 · 40 kg · 2 min between sets</span>
    <MobileSearchField label="Search exercises" placeholder="Name, muscle, mobility or floor" />
    <div class="chip-row" role="group" aria-label="Filters">
      <MobileFilterChip icon="dumbbell" aria-haspopup="dialog" aria-label="Equipment" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="target" aria-haspopup="dialog" aria-label="Focus" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="armchair" aria-haspopup="dialog" aria-label="Position" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="person-standing" aria-haspopup="dialog" aria-label="Zones" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="tag" aria-haspopup="dialog" aria-label="Tags" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
    </div>
  </div>

  <div class="list-meta"><span aria-live="polite">34 exercises</span></div>

  <div id="catalog" style="flex: 1; min-height: 0; overflow: hidden; padding: 0 var(--cp-space-lg) var(--cp-space-lg); display: flex; flex-direction: column; gap: 6px;">
    <h2 class="label" style="margin: 10px var(--cp-space-xs) 2px;">Squat</h2>
    <ul style="display: flex; flex-direction: column; gap: var(--cp-space-sm);">
      <li><div class="list-row" data-component="exercise-row" style="min-height: 56px; padding: 0 var(--cp-space-md) 0 0;">
        <button type="button" aria-label="Sit to stand, swap for this exercise" style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: var(--cp-space-md); padding: var(--cp-space-sm) 0 var(--cp-space-sm) var(--cp-space-md); color: inherit; text-decoration: none;">
        <span class="row-icon" aria-hidden="true"><MobileIcon name="person-standing" :size="22" /></span>
        <span class="row-text"><strong>Sit to stand</strong><span>Quadriceps, glutes · No equipment</span></span></button>
      </div></li>
      <li><div class="list-row" data-component="exercise-row" style="min-height: 56px; padding: 0 var(--cp-space-md) 0 0;">
        <button type="button" aria-label="Bodyweight squat, swap for this exercise" style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: var(--cp-space-md); padding: var(--cp-space-sm) 0 var(--cp-space-sm) var(--cp-space-md); color: inherit; text-decoration: none;">
        <span class="row-icon" aria-hidden="true"><MobileIcon name="person-standing" :size="22" /></span>
        <span class="row-text"><strong>Bodyweight squat</strong><span>Quadriceps, glutes · No equipment</span></span></button>
      </div></li>
      <li><div class="list-row" data-component="exercise-row" style="min-height: 56px; padding: 0 var(--cp-space-md) 0 0;">
        <button type="button" aria-label="Goblet squat, swap for this exercise" style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: var(--cp-space-md); padding: var(--cp-space-sm) 0 var(--cp-space-sm) var(--cp-space-md); color: inherit; text-decoration: none;">
        <span class="row-icon" aria-hidden="true"><MobileIcon name="person-standing" :size="22" /></span>
        <span class="row-text"><strong>Goblet squat</strong><span>Quadriceps, glutes, core · Dumbbell or kettlebell</span></span></button>
      </div></li>
      <li><div class="list-row" data-component="exercise-row" style="min-height: 56px; padding: 0 var(--cp-space-md) 0 0;">
        <button type="button" aria-label="Wall sit, swap for this exercise" style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: var(--cp-space-md); padding: var(--cp-space-sm) 0 var(--cp-space-sm) var(--cp-space-md); color: inherit; text-decoration: none;">
        <span class="row-icon" aria-hidden="true"><MobileIcon name="person-standing" :size="22" /></span>
        <span class="row-text"><strong>Wall sit</strong><span>Quadriceps, glutes · Hold</span></span></button>
      </div></li>
    </ul>
    <p class="hint" style="padding: var(--cp-space-sm) var(--cp-space-xs);">The row swaps the exercise and goes back to the builder. Open the details from the exercise page.</p>
  </div>
</main>
