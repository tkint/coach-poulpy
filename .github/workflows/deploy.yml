name: Deploy

# Run by hand: Actions > Deploy > Run workflow. It writes the app's .env from the chosen GitHub
# environment, uploads it with the server and shared Caddy files over SSH and deploys a server image
# (ADR 0019). A pull request number builds that pull request's server image first and deploys it
# with its own files, to try it before it merges; "branch" does the same for the selected branch.
# "website" deploys the web app (app.coach-poulpy.com) the same way instead, in its own container
# and Caddy route, without touching the server (ADR 0021). "all" does both in one run, the server
# first, so a change that spans the API and the website goes out together.
# Setup and secrets: docs/releasing.md, "Deploy the server".
on:
  workflow_dispatch:
    inputs:
      part:
        description: "What to deploy"
        type: choice
        options: [server, website, all]
        default: server
      environment:
        description: "Where to deploy"
        type: choice
        options: [production, preview]
        default: production
      version:
        description: "latest, a release such as 0.3.0, a pull request number such as 275, or branch for the branch above"
        default: latest
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      # One part after the other, the server first; a failed server leaves the website as it was.
      max-parallel: 1
      matrix:
        part: ${{ fromJSON(inputs.part == 'all' && '["server","website"]' || format('["{0}"]', inputs.part)) }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Pick the image
        id: image
        env:
          VERSION: ${{ inputs.version }}
          PART: ${{ matrix.part }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # What to check out (empty: the selected branch) and whether to build the image first.
          REF=""
          BUILD=false
          if printf '%s' "$VERSION" | grep -Eq '^(#|pr-)?[0-9]+$'; then
            NUMBER="${VERSION##*[#-]}"
            PR="$(gh api "repos/$REPOSITORY/pulls/$NUMBER")" || { echo "::error::No pull request #$NUMBER."; exit 1; }
            if [ "$(jq -r .state <<<"$PR")" != open ]; then
              echo "::error::Pull request #$NUMBER isn't open."; exit 1
            fi
            # Its code runs with the deploy secrets, so only branches of this repository, never forks.
            if [ "$(jq -r .head.repo.full_name <<<"$PR")" != "$REPOSITORY" ]; then
              echo "::error::Pull request #$NUMBER comes from a fork, which is never deployed."; exit 1
            fi
            REF="$(jq -r .head.sha <<<"$PR")"
            VERSION="pr-$NUMBER"
            BUILD=true
            echo "Deploying pull request #$NUMBER at $REF"
          elif [ "$VERSION" = branch ]; then
            VERSION="branch-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-100)"
            BUILD=true
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid image version."; exit 1
          fi
          { echo "tag=$VERSION"; echo "ref=$REF"; echo "build=$BUILD"; } >> "$GITHUB_OUTPUT"
          if [ "$PART" = website ]; then
            { echo "name=coach-poulpy-web"; echo "dockerfile=web/Dockerfile"; } >> "$GITHUB_OUTPUT"
          else
            { echo "name=coach-poulpy-server"; echo "dockerfile=server/Dockerfile"; } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.image.outputs.ref }}

      # A pull request or a branch has no published image: it is built here, tagged pr-<number>
      # or branch-<name>.
      - name: Read the Android signing key's fingerprint for assetlinks.json
        id: cert
        if: steps.image.outputs.build == 'true' && matrix.part == 'website'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No signing key: the website has no assetlinks.json, so email links open the browser instead of the app."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/poulpy.jks"
          sha="$(keytool -list -v -keystore "$RUNNER_TEMP/poulpy.jks" -storepass "$KEYSTORE_PASSWORD" -alias poulpy |
            sed -n 's/^[[:space:]]*SHA256: *//p')"
          rm -f "$RUNNER_TEMP/poulpy.jks"
          [ -n "$sha" ] || { echo "::error::keytool printed no SHA256 for the alias poulpy."; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.image.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          # The machine is amd64 (ADR 0019), as in the Release workflow.
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.image.outputs.tag }}
            ANDROID_CERT_SHA256=${{ steps.cert.outputs.sha256 }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the machine
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
          HOST_KEY: ${{ vars.DEPLOY_HOST_KEY || secrets.DEPLOY_HOST_KEY }}
          VERSION: ${{ steps.image.outputs.tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          PART: ${{ matrix.part }}
          # The web app's hostname, for "website".
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          # Written to the app's .env on the server.
          DOMAIN: ${{ vars.DOMAIN }}
          # Names the folder, the Compose project, the server's alias and its Caddy route: another
          # name runs beside production, the same name replaces it.
          APP_NAME: ${{ vars.APP_NAME || 'coach-poulpy' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Mail (docs/deploying-the-server.md). Each setting may be a variable or a secret, of the
          # environment or the repository; an environment's value wins over the repository's.
          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER || secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM || secrets.MAIL_FROM }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          # Logs shipped to Grafana Cloud Loki (docs/deploying-the-server.md): all three, or none.
          LOKI_URL: ${{ vars.LOKI_URL }}
          LOKI_USER: ${{ vars.LOKI_USER }}
          LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}
        run: |
          if [ "$PART" = website ]; then
            required="WEB_DOMAIN:WEB_DOMAIN"
          else
            required="DOMAIN:DOMAIN POSTGRES_PASSWORD:POSTGRES_PASSWORD"
          fi
          for name in DEPLOY_SSH_KEY:SSH_KEY DEPLOY_HOST:HOST DEPLOY_USER:SSH_USER \
            DEPLOY_HOST_KEY:HOST_KEY $required; do
            if [ -z "$(printenv "${name#*:}")" ]; then
              echo "::error::Missing ${name%%:*} in the $ENVIRONMENT environment."; exit 1
            fi
          done
          if ! printf '%s' "$APP_NAME" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "::error::APP_NAME may only have lowercase letters, digits and dashes."; exit 1
          fi
          if [ "$PART" = server ] && [ -z "$SMTP_HOST" ]; then
            echo "::warning::No SMTP_HOST variable or secret in the $ENVIRONMENT environment or the repository: the server will print emails to its log instead of sending them."
          elif [ "$PART" = server ] && [ -z "$MAIL_FROM" ]; then
            echo "::error::Missing MAIL_FROM in the $ENVIRONMENT environment, needed with SMTP_HOST."; exit 1
          fi
          LOGS=false
          if [ "$PART" = server ]; then
            if [ -n "$LOKI_URL$LOKI_USER$LOKI_PASSWORD" ] && { [ -z "$LOKI_URL" ] || [ -z "$LOKI_USER" ] || [ -z "$LOKI_PASSWORD" ]; }; then
              echo "::error::LOKI_URL, LOKI_USER and LOKI_PASSWORD go together in the $ENVIRONMENT environment: set all three or none."; exit 1
            elif [ -n "$LOKI_URL" ]; then
              LOGS=true
            else
              echo "::warning::No LOKI_URL in the $ENVIRONMENT environment: logs stay on the machine."
            fi
          fi
          for name in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD MAIL_FROM WEBSITE_URL LOKI_URL LOKI_USER LOKI_PASSWORD ADMIN_EMAIL; do
            # Written in single quotes below, so Compose reads a $ in a password as itself.
            case "$(printenv "$name")" in *\'*|*$'\n'*) echo "::error::$name may not hold a quote or a line break."; exit 1;; esac
          done

          umask 077
          if [ "$PART" = website ]; then
            # Its own folder, Compose project, alias and Caddy route: <APP_NAME>-web.
            printf 'APP_NAME=%s-web\nDOMAIN=%s\nIMAGE_TAG=%s\n' "$APP_NAME" "$WEB_DOMAIN" "$VERSION" > "$RUNNER_TEMP/.env"
          else
            {
              printf 'APP_NAME=%s\nDOMAIN=%s\nIMAGE_TAG=%s\nPOSTGRES_PASSWORD=%s\n' \
                "$APP_NAME" "$DOMAIN" "$VERSION" "$POSTGRES_PASSWORD"
              printf "SMTP_HOST='%s'\nSMTP_PORT='%s'\nSMTP_USER='%s'\nSMTP_PASSWORD='%s'\nMAIL_FROM='%s'\nWEBSITE_URL='%s'\nADMIN_EMAIL='%s'\n" \
                "$SMTP_HOST" "$SMTP_PORT" "$SMTP_USER" "$SMTP_PASSWORD" "$MAIL_FROM" "$WEBSITE_URL" "$ADMIN_EMAIL"
              # The alloy service (log shipping) only starts under this profile.
              printf "DEPLOY_ENVIRONMENT=%s\nCOMPOSE_PROFILES=%s\n" "$ENVIRONMENT" "$($LOGS && echo logs)"
              if $LOGS; then
                printf "LOKI_URL='%s'\nLOKI_USER='%s'\nLOKI_PASSWORD='%s'\n" "$LOKI_URL" "$LOKI_USER" "$LOKI_PASSWORD"
              fi
            } > "$RUNNER_TEMP/.env"
          fi
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          remote() {
            ssh -i "$RUNNER_TEMP/key" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" "$SSH_USER@$HOST" "$1"
          }

          tar -C deploy/caddy -czf - compose.yaml bootstrap.json deploy.py | remote 'mkdir -p ~/caddy && tar -xzf - -C ~/caddy'
          if [ "$PART" = website ]; then
            tar -C deploy/web -czf - compose.yaml coach-poulpy-web.caddy -C "$RUNNER_TEMP" .env |
              remote "mkdir -p ~/$APP_NAME-web && tar -xzf - -C ~/$APP_NAME-web"
            remote "python3 ~/caddy/deploy.py ~/$APP_NAME-web compose.yaml coach-poulpy-web.caddy"
          else
            tar -C deploy -czf - compose.yaml coach-poulpy.caddy alloy -C "$RUNNER_TEMP" .env |
              remote "mkdir -p ~/$APP_NAME && tar -xzf - -C ~/$APP_NAME"
            remote "python3 ~/caddy/deploy.py ~/$APP_NAME compose.yaml coach-poulpy.caddy"
          fi
