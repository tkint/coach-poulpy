<main class="phone" style="--frame-height: 1300px">
  <header class="top-bar">
    <button type="button" class="icon-button" aria-label="Back to the library"><MobileIcon name="chevron-left" /></button>
    <button class="icon-button" type="button" aria-label="More options" aria-haspopup="menu"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
  </header>

  <div class="page-body">
    <div id="workout-summary" style="display: flex; flex-direction: column; gap: var(--cp-space-xs);">
      <span class="label label--primary">Strength</span>
      <h1 class="title" style="font-size: 30px; line-height: 34px;">Upper body</h1>
      <p class="workout-details">
        <MobileFormatChip id="format" icon="list">Sets</MobileFormatChip>
        <span>7 exercises · about 32 min · barbell, dumbbells</span>
      </p>
    </div>

    <button type="button" class="plan-button" data-component="plan-button"><MobileIcon name="calendar-plus" :size="20" />Plan it for a day</button>

    <div class="stat-tiles">
      <MobileStatTile label="Done" value="3 times" />
      <MobileStatTile label="Last time" value="Wed 21" />
      <MobileStatTile label="Usually" value="31 min" />
    </div>

    <section class="part" id="warm-up" data-component="part" aria-labelledby="warm-up-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon" aria-hidden="true"><MobileIcon name="sun" :size="20" /></span>
        <div><h2 id="warm-up-name">Warm-up</h2><p>2 steps · about 6 min</p></div>
      </div>
      <ol class="steps">
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">1</span>
            <span class="step-text"><strong>Walk</strong><span>5 min</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">2</span>
            <span class="step-text"><strong>Arm circle</strong><span>30 s</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
      </ol>
    </section>
    <section class="part" id="work" data-component="part" aria-labelledby="work-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon part-icon--work" aria-hidden="true"><MobileIcon name="zap" :size="20" /></span>
        <div><h2 id="work-name">Work</h2><p>4 exercises · about 25 min</p></div>
      </div>
      <ol class="steps">
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">3</span>
            <span class="step-text"><strong>Bench press</strong><span>3 × 8 · 40 kg · 2 min between sets</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">4</span>
            <span class="step-text"><strong>Bent-over row</strong><span>3 × 10 · 30 kg · 1 min 30 s between sets</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
        <li>
        <section class="repeat" data-component="repeat" aria-label="Repeat 3 times">
          <div class="repeat-header"><MobileIcon name="repeat" :size="20" /><strong>Repeat · 3 times</strong></div>
          <ol class="steps">
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">5</span>
            <span class="step-text"><strong>Biceps curl</strong><span>12 reps · 10 kg</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">6</span>
            <span class="step-text"><strong>Triceps dip</strong><span>12 reps</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
        <li class="step-row" data-component="step-row">
          <span class="step-number step-number--rest" aria-hidden="true"><MobileIcon name="timer" :size="18" /></span>
          <span class="step-text"><MobileRoleTag>Recover</MobileRoleTag><strong>Rest</strong><span>1 min</span></span>
        </li>
      </ol>
        </section>
      </li>
      </ol>
    </section>
    <section class="part" id="cool-down" data-component="part" aria-labelledby="cool-down-name">
      <div class="part-header" data-component="part-header">
        <span class="part-icon" aria-hidden="true"><MobileIcon name="moon" :size="20" /></span>
        <div><h2 id="cool-down-name">Cool down</h2><p>1 step · 1 min</p></div>
      </div>
      <ol class="steps">
        <li>
          <button type="button" class="step-row" data-component="step-row">
            <span class="step-number" aria-hidden="true">7</span>
            <span class="step-text"><strong>Chest stretch</strong><span>30 s hold · each side</span></span>
            <MobileIcon name="chevron-right" :size="20" />
          </button>
        </li>
      </ol>
    </section>
  </div>

  <div class="action-bar">
    <MobileButton kind="secondary" size="md" icon="pencil" style="flex: 1;">Edit</MobileButton>
    <MobileButton size="md" icon="play" style="flex: 1.6;">Start now</MobileButton>
  </div>
</main>
