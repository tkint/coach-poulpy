# XcodeGen spec. Generate the Xcode project with `xcodegen` in this folder,
# then open CoachPoulpy.xcodeproj. The .xcodeproj itself is not committed.
name: CoachPoulpy
options:
  bundleIdPrefix: ch.coachpoulpy
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team id here or in Xcode to install on a device.
    DEVELOPMENT_TEAM: ""
targets:
  CoachPoulpy:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: CoachPoulpy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.coachpoulpy
        PRODUCT_NAME: Coach Poulpy
        INFOPLIST_FILE: CoachPoulpy/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin builds the simulator framework for Apple silicon only (iosSimulatorArm64).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # The Kotlin framework is built by Gradle into this folder by the pre-build script.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, Shared]
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
