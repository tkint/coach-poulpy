":[{\"text\":\"Workout page\",\"link\":\"/mockups/mobile/drafts/workout-page\"}]}]}]},{\"text\":\"Web\",\"collapsed\":false,\"items\":[{\"text\":\"Components\",\"link\":\"/web-components\",\"collapsed\":true,\"items\":[{\"text\":\"Button\",\"link\":\"/web-components#button\"},{\"text\":\"Chip\",\"link\":\"/web-components#chip\"},{\"text\":\"Search field\",\"link\":\"/web-components#search-field\"},{\"text\":\"Stepper\",\"link\":\"/web-components#stepper\"},{\"text\":\"Select field\",\"link\":\"/web-components#select-field\"},{\"text\":\"Password field\",\"link\":\"/web-components#password-field\"},{\"text\":\"Poulpy card\",\"link\":\"/web-components#poulpy-card\"},{\"text\":\"Error\",\"link\":\"/web-components#error\"},{\"text\":\"Sheet\",\"link\":\"/web-components#sheet\"},{\"text\":\"Type\",\"link\":\"/web-components#type\"}]},{\"text\":\"Mockups\",\"link\":\"/mockups/web/\",\"collapsed\":true,\"items\":[{\"text\":\"Agreed\",\"link\":\"/mockups/web/agreed\",\"collapsed\":true,\"items\":[{\"text\":\"Accounts\",\"link\":\"/mockups/web/agreed/accounts\"}]},{\"text\":\"Drafts\",\"link\":\"/mockups/web/drafts\",\"collapsed\":true,\"items\":[]}]}]},{\"text\":\"Profile and settings\",\"link\":\"/docs/profile-and-settings\"},{\"text\":\"Generating tokens and fonts\",\"link\":\"/design/README\"},{\"text\":\"Body map shapes: credits\",\"link\":\"/design/body-map-source/NOTICE\"}]}],\"/docs/architecture\":[{\"text\":\"Architecture\",\"items\":[{\"text\":\"Overview\",\"link\":\"/docs/architecture\"},{\"text\":\"Roadmap\",\"link\":\"/docs/roadmap\"},{\"text\":\"Glossary\",\"link\":\"/CONTEXT\"},{\"text\":\"The workout file\",\"link\":\"/docs/workout-file\"},{\"text\":\"The API\",\"link\":\"/docs/the-api\"},{\"text\":\"Accounts\",\"link\":\"/docs/accounts\"},{\"text\":\"Decisions\",\"link\":\"/decisions/\",\"collapsed\":true,\"items\":[{\"text\":\"0001 · Local-first: the phone is the source of truth\",\"link\":\"/docs/adr/0001-local-first-phone-is-the-source-of-truth\"},{\"text
