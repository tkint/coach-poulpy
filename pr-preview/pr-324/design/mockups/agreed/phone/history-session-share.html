<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History · share a session</title>
<meta name="mockup:screen" content="history-session-share">
<meta name="mockup:section" content="History">
<meta name="mockup:issue" content="104">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/ui/src/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone">
  <header class="back-bar" style="padding-left: var(--cp-space-md); padding-right: var(--cp-space-md);"><a class="icon-button" href="history-calendar.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><h1 style="flex: 1;">Lower body strength</h1><a class="icon-button icon-button--quiet" href="history-session-share.html" aria-label="Share this session"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg></a><a class="icon-button icon-button--quiet" href="history-session-delete.html" aria-label="Delete this session"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></a></header>
  <div class="live-body" style="padding-top: var(--cp-space-md); gap: 14px;">
    <section class="summary-card" id="session-head">
      <img src="../../../poulpy/pose_exhausted.svg" alt="Poulpy exhausted with a sweatband">
      <div><span class="label" style="color: inherit;">Strength</span><span class="headline" style="font: var(--cp-type-headline);">Sat 24 Oct 2026, 18:05</span></div>
    </section>
    <dl class="facts" id="session-facts" style="border: 1px solid var(--cp-outline);">
      <div><dt>Duration</dt><dd>38:24</dd></div>
      <div><dt>Sets done</dt><dd>17 / 18</dd></div>
      <div><dt>Sets skipped</dt><dd>1</dd></div>
    </dl>
  </div>
  <div class="scrim"></div>
  <section class="sheet" id="share-sheet" data-component="sheet" role="dialog" aria-label="Share this session">
    <span class="sheet-handle"></span>
    <div class="sheet-title"><h2>Share this session</h2><p>Pick a format.</p></div>
    <div class="option-list">
      <a class="option-row" data-component="option-row" href="history-session.html"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>.FIT file<small class="hint" style="display: block; font-weight: 600;">Save it, then import it on the Garmin Connect or Strava website</small></span></a>
      <a class="option-row" data-component="option-row" href="history-session.html"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg><span>Image<small class="hint" style="display: block; font-weight: 600;">A card with your numbers to send or post</small></span></a>
    </div>
  </section>
</main>
</body>
</html>
