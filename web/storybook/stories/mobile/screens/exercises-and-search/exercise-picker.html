<main class="phone">
<div class="screen-header" style="padding-top: 48px; padding-bottom: var(--cp-space-sm); gap: var(--cp-space-md);">
    <div style="display: flex; align-items: center; gap: var(--cp-space-xs); margin-left: -8px;">
      <button type="button" class="icon-button" aria-label="Back to the workout"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-left"><path d="m15 18-6-6 6-6"/></svg></button>
      <div style="display: flex; flex-direction: column;"><h1 class="headline">Pick an exercise</h1><span class="muted" style="font-size: 13.5px; line-height: 18px; font-weight: 700;">For Lower body strength · Strength</span></div>
    </div>
    <MobileSearchField label="Search exercises" placeholder="Name, muscle, mobility or floor" />
    <div class="chip-row" role="group" aria-label="Filters">
      <MobileFilterChip icon="dumbbell" aria-haspopup="dialog" aria-label="Equipment" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="target" aria-haspopup="dialog" aria-label="Focus" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="armchair" aria-haspopup="dialog" aria-label="Position" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="person-standing" aria-haspopup="dialog" aria-label="Zones" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
      <MobileFilterChip icon="tag" aria-haspopup="dialog" aria-label="Tags" style="padding: 0 var(--cp-space-md); min-width: 48px;" />
    </div>
  </div>

  <div class="list-meta"><span aria-live="polite">34 exercises</span></div>

  <div id="catalog" style="flex: 1; min-height: 0; overflow: hidden; padding: 0 var(--cp-space-lg) var(--cp-space-lg); display: flex; flex-direction: column; gap: 6px;">
    <h2 class="label" style="margin: 10px var(--cp-space-xs) 2px;">Squat</h2>
    <ul style="display: flex; flex-direction: column; gap: var(--cp-space-sm);">
      <li><div class="list-row" data-component="exercise-row" style="min-height: 56px; padding: 0 var(--cp-space-md) 0 0;">
        <button type="button" aria-label="Sit to stand, see details" style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: var(--cp-space-md); padding: var(--cp-space-sm) 0 var(--cp-space-sm) var(--cp-space-md); color: inherit; text-decoration: none;">
        <span class="row-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="person-standing"><circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg></span>
        <span class="row-text"><strong>Sit to stand</strong><span>Quadriceps, glutes · No equipment</span></span></button>
        <button type="button" aria-label="Add Sit to stand" data-component="quick-add-button" style="width: 36px; height: 36px; border-radius: var(--cp-radius-pill); background: var(--cp-primary); color: var(--cp-on-primary); display: flex; align-items: center; justify-content: center; flex: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div></li>
      <li><div class="list-row" data-component="exercise-row" style="min-height: 56px; padding: 0 var(--cp-space-md) 0 0;">
        <button type="button" aria-label="Bodyweight squat, see details" style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: var(--cp-space-md); padding: var(--cp-space-sm) 0 var(--cp-space-sm) var(--cp-space-md); color: inherit; text-decoration: none;">
        <span class="row-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="person-standing"><circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg></span>
        <span class="row-text"><strong>Bodyweight squat</strong><span>Quadriceps, glutes · No equipment</span></span></button>
        <button type="button" aria-label="Add Bodyweight squat" data-component="quick-add-button" style="width: 36px; height: 36px; border-radius: var(--cp-radius-pill); background: var(--cp-primary); color: var(--cp-on-primary); display: flex; align-items: center; justify-content: center; flex: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div></li>
      <li><div class="list-row" data-component="exercise-row" style="min-height: 56px; padding: 0 var(--cp-space-md) 0 0;">
        <button type="button" aria-label="Goblet squat, see details" style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: var(--cp-space-md); padding: var(--cp-space-sm) 0 var(--cp-space-sm) var(--cp-space-md); color: inherit; text-decoration: none;">
        <span class="row-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="person-standing"><circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg></span>
        <span class="row-text"><strong>Goblet squat</strong><span>Quadriceps, glutes, core · Dumbbell or kettlebell</span></span></button>
        <button type="button" aria-label="Add Goblet squat" data-component="quick-add-button" style="width: 36px; height: 36px; border-radius: var(--cp-radius-pill); background: var(--cp-primary); color: var(--cp-on-primary); display: flex; align-items: center; justify-content: center; flex: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div></li>
      <li><div class="list-row" data-component="exercise-row" style="min-height: 56px; padding: 0 var(--cp-space-md) 0 0;">
        <button type="button" aria-label="Wall sit, see details" style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: var(--cp-space-md); padding: var(--cp-space-sm) 0 var(--cp-space-sm) var(--cp-space-md); color: inherit; text-decoration: none;">
        <span class="row-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="person-standing"><circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg></span>
        <span class="row-text"><strong>Wall sit</strong><span>Quadriceps, glutes · Hold</span></span></button>
        <button type="button" aria-label="Add Wall sit" data-component="quick-add-button" style="width: 36px; height: 36px; border-radius: var(--cp-radius-pill); background: var(--cp-primary); color: var(--cp-on-primary); display: flex; align-items: center; justify-content: center; flex: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div></li>
    </ul>
    <p class="hint" style="padding: var(--cp-space-sm) var(--cp-space-xs);">The row opens the details. The plus, in the row, goes straight to the add sheet.</p>
  </div>
</main>
