<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · walk step without a treadmill</title>
<meta name="mockup:screen" content="live-mixed-player-no-treadmill">
<meta name="mockup:section" content="Live">
<meta name="mockup:issue" content="82">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../web/ui/src/tokens.css">
<link rel="stylesheet" href="../../shared/mockup.css">
<script src="../../shared/mockup-theme.js"></script>
</head>
<body>
<main class="phone player">
  <div class="session-progress" id="session-progress">
    <button class="icon-button icon-button--filled" type="button" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="pause"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg></button>
    <div>
      <span class="label numbers">Step 5 of 6 · 31:05</span>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="4" aria-label="Session progress"><div style="width: 66%;"></div></div>
    </div>
    <a class="icon-button icon-button--filled" href="#" aria-label="End session"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
  </div>

  <div class="player-step" id="current-step">
    <img src="../../../poulpy/pose_straining.svg" alt="Poulpy waiting">
    <span class="part-line" id="part-line" data-component="part-line">Cool-down</span>
    <h1 class="title">Walk</h1>
    <span class="set-count numbers">Not connected to a treadmill</span>
    <span class="target-value">10</span>
    <span class="target-unit">min</span>
  </div>
  <div class="player-actions">
    <button class="secondary-button secondary-button--large" data-component="secondary-button" type="button">Skip</button>
    <a class="primary-button primary-button--large" data-component="primary-button" href="#">Start</a>
  </div>
</main>
</body>
</html>
