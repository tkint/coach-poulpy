<main class="phone">
<header class="top-bar">
    <button type="button" class="icon-button" aria-label="Back to the library"><MobileIcon name="chevron-left" /></button>
    <button class="icon-button" type="button" aria-label="More options" aria-haspopup="menu"><MobileIcon name="ellipsis-vertical" :size="20" /></button>
  </header>

  <div class="page-body">
    <div id="workout-summary" style="display: flex; flex-direction: column; gap: 2px;">
      <span class="label label--primary">Strength</span>
      <h1 class="title" style="font-size: 30px; line-height: 34px;">Upper body</h1>
      <p class="workout-details">4 exercises · about 32 min · dumbbells, mat</p>
    </div>

    <section id="planned-days" data-component="planned-days" aria-label="Planned days" style="border-radius: var(--cp-radius-md); background: var(--cp-primary-container); color: var(--cp-on-primary-container); padding: var(--cp-space-sm) var(--cp-space-sm) 10px var(--cp-space-md); display: flex; flex-direction: column; gap: var(--cp-space-sm);">
      <div style="display: flex; align-items: center; gap: 10px;">
        <MobileIcon name="calendar" :size="22" />
        <span style="flex: 1; font-size: 15px; line-height: 20px; font-weight: 800;">Planned on 3 days</span>
        <button type="button" style="min-height: 40px; padding: 0 var(--cp-space-md); border-radius: var(--cp-radius-pill); background: var(--cp-surface); font-size: 14px; font-weight: 800; display: flex; align-items: center;">Change days</button>
      </div>
      <ul style="display: flex; flex-wrap: wrap; gap: 6px;">
        <li style="height: 32px; padding: 0 var(--cp-space-md); border-radius: var(--cp-radius-pill); background: var(--cp-surface); color: var(--cp-on-surface); font-size: 14px; font-weight: 800; display: flex; align-items: center; font-variant-numeric: tabular-nums;">Tue 27 Oct</li>
        <li style="height: 32px; padding: 0 var(--cp-space-md); border-radius: var(--cp-radius-pill); background: var(--cp-surface); color: var(--cp-on-surface); font-size: 14px; font-weight: 800; display: flex; align-items: center; font-variant-numeric: tabular-nums;">Fri 30 Oct</li>
        <li style="height: 32px; padding: 0 var(--cp-space-md); border-radius: var(--cp-radius-pill); background: var(--cp-surface); color: var(--cp-on-surface); font-size: 14px; font-weight: 800; display: flex; align-items: center; font-variant-numeric: tabular-nums;">Tue 3 Nov</li>
      </ul>
    </section>

    <div class="stat-tiles">
      <MobileStatTile label="Done" value="3 times" />
      <MobileStatTile label="Last time" value="Wed 21" />
      <MobileStatTile label="Usually" value="31 min" />
    </div>

    <span class="label" style="margin: var(--cp-space-xs) var(--cp-space-xs) 0;">Exercises</span>
    <ol class="steps">
      <li>
        <button type="button" class="step-row" data-component="step-row">
          <span class="step-number" aria-hidden="true">1</span>
          <span class="step-text"><strong>Push-up</strong><span>3 × 12 · rest 60 s</span></span>
          <MobileIcon name="chevron-right" :size="20" />
        </button>
      </li>
      <li>
        <button type="button" class="step-row" data-component="step-row">
          <span class="step-number" aria-hidden="true">2</span>
          <span class="step-text"><strong>One-arm dumbbell row</strong><span>3 × 10 each side · 14 kg · rest 60 s</span></span>
          <MobileIcon name="chevron-right" :size="20" />
        </button>
      </li>
      <li>
        <button type="button" class="step-row" data-component="step-row">
          <span class="step-number" aria-hidden="true">3</span>
          <span class="step-text"><strong>Dumbbell overhead press</strong><span>3 × 8 · 10 kg · rest 90 s</span></span>
          <MobileIcon name="chevron-right" :size="20" />
        </button>
      </li>
      <li>
        <button type="button" class="step-row" data-component="step-row">
          <span class="step-number" aria-hidden="true">4</span>
          <span class="step-text"><strong>Plank</strong><span>3 × 40 s hold · rest 45 s</span></span>
          <MobileIcon name="chevron-right" :size="20" />
        </button>
      </li>
    </ol>
  </div>

  <div class="action-bar">
    <MobileButton kind="secondary" icon="pencil" :icon-size="18" style="flex: 1; font-size: 16px;">Edit</MobileButton>
    <MobileButton icon="play" :icon-size="18" style="flex: 1.6;">Start now</MobileButton>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="dialog" id="delete-dialog"><div role="alertdialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-body" data-component="dialog">
    <img src="../../../poulpy/pose_thinking.svg" alt="">
    <h2 id="delete-title">Delete Upper body?</h2>
    <p id="delete-body">It comes off its 3 planned days. The 3 times you did it stay in History.</p>
    <div class="actions"><button type="button" class="secondary-button">Cancel</button><button type="button" class="danger-button"><MobileIcon name="trash" :size="20" />Delete</button></div>
  </div></div>
</main>
